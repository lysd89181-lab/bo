<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B19">
<title>ملفي — تسجيل الدخول</title>
<script>try{var d=document.documentElement;if(localStorage.getItem('malafy.theme')==='light')d.dataset.theme='light';if(localStorage.getItem('malafy.lang')==='en'){d.lang='en';d.dir='ltr'}}catch(e){}</script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth">
  <div class="auth-prefs" id="prefs"></div>
  <section class="auth-art">
    <div>
      <div id="bigLogo"></div>
      <h1>ملفي</h1>
      <p>إدارة وبيع المنتجات الرقمية في مكان واحد: الحسابات وملفاتها، الأكواد، الأرقام، والزباين.</p>
    </div>
    <div class="feats" id="feats"></div>
    <div id="ridge"></div>
  </section>

  <section class="auth-form">
    <div class="card glow">
      <div class="tabs" style="margin-bottom:22px" role="tablist">
        <button class="on" data-tab="login" role="tab">تسجيل الدخول</button>
        <button data-tab="register" role="tab">حساب تاجر جديد</button>
      </div>

      <form id="loginForm" novalidate>
        <h2>أهلاً بعودتك</h2>
        <p class="muted small" style="margin-bottom:20px">ادخل لحسابك وكمّل شغلك.</p>
        <div class="field"><label for="lEmail">البريد الإلكتروني</label><input id="lEmail" type="email" autocomplete="email" dir="ltr" required></div>
        <div class="field"><label for="lPass">كلمة المرور</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></div>
        <p class="err" id="lErr"></p>
        <button class="btn amber full" id="lBtn" type="submit">تسجيل الدخول</button>
        <button class="link" type="button" id="forgot" style="margin-top:14px">نسيت كلمة المرور؟</button>
      </form>

      <form id="regForm" novalidate hidden>
        <h2>حساب تاجر جديد</h2>
        <p class="muted small" style="margin-bottom:20px">بعد التسجيل تختار خطة الاشتراك، والإدارة تفعّل حسابك.</p>
        <div id="regClosed" hidden class="payinfo" style="margin-bottom:14px">التسجيل مغلق حالياً. تواصل مع إدارة المنصة.</div>
        <div class="field"><label for="rName">الاسم أو اسم المتجر</label><input id="rName" autocomplete="name" maxlength="80" required></div>
        <div class="field"><label for="rPhone">رقم الواتساب</label><input id="rPhone" type="tel" inputmode="tel" dir="ltr" placeholder="09XXXXXXXX" maxlength="30" required></div>
        <div class="field"><label for="rEmail">البريد الإلكتروني</label><input id="rEmail" type="email" autocomplete="email" dir="ltr" required></div>
        <div class="field"><label for="rPass">كلمة المرور</label><input id="rPass" type="password" autocomplete="new-password" dir="ltr" minlength="6" required><span class="hint">6 أحرف على الأقل</span></div>
        <p class="err" id="rErr"></p>
        <button class="btn amber full" id="rBtn" type="submit">إنشاء الحساب</button>
      </form>
    </div>
  </section>
</div>

<script type="module">
import {
  auth, db, $, $$, icon, LOGO, RIDGE, busy, errText, toast, modal, esc, apiPost, apiPublic,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile,
  onAuthStateChanged, ensureUserDoc, getDoc, doc, prefsHTML, bindPrefs, startI18n, isEN, t
} from './core.js';

$('#prefs').innerHTML = prefsHTML(); bindPrefs();
auth.languageCode = isEN ? 'en' : 'ar';
$('#bigLogo').innerHTML = LOGO();
$('#ridge').innerHTML = RIDGE;
$('#feats').innerHTML = [['trend', 'أرباح أوضح'], ['bolt', 'تسليم بضغطة'], ['shield', 'بياناتك لك وحدك']]
  .map(([i, x]) => `<div>${icon(i)}<span>${x}</span></div>`).join('');
startI18n();

// لو داخل من قبل نحوله مباشرة
let redirecting = false;
async function go(u) {
  if (redirecting) return; redirecting = true;
  const data = await ensureUserDoc(u);   // يكمّل التسجيل لو كان ناقص
  location.replace(data.role === 'admin' ? 'admin.html' : 'app.html');
}
let registering = false;
onAuthStateChanged(auth, u => { if (u && !registering) go(u).catch(() => { redirecting = false; }); });

// تبويبات
$$('[data-tab]').forEach(b => b.onclick = () => {
  $$('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  $('#loginForm').hidden = b.dataset.tab !== 'login';
  $('#regForm').hidden = b.dataset.tab !== 'register';
});

// هل التسجيل مفتوح؟
getDoc(doc(db, 'settings', 'platform')).then(s => {
  if (s.exists() && s.data().registrationOpen === false) {
    $('#regClosed').hidden = false; $('#rBtn').disabled = true;
  }
}).catch(() => {});

$('#loginForm').onsubmit = e => {
  e.preventDefault();
  const email = $('#lEmail').value.trim(), pass = $('#lPass').value;
  $('#lErr').textContent = '';
  if (!email || !pass) { $('#lErr').textContent = 'اكتب الإيميل وكلمة المرور.'; return; }
  busy($('#lBtn'), async () => {
    try { const c = await signInWithEmailAndPassword(auth, email, pass); await go(c.user); }
    catch (err) { $('#lErr').textContent = errText(err); }
  });
};

// استرجاع كلمة المرور بكود من 6 أرقام
$('#forgot').onclick = () => {
  let email = $('#lEmail').value.trim();
  const m = modal(t('استرجاع كلمة المرور'), `<div id="fpBox"></div>`);
  const box = $('#fpBox', m.el);
  const step1 = () => {
    box.innerHTML = `<p class="muted small" style="margin-bottom:14px">${t('اكتب إيميل حسابك، ونبعتولك كود من 6 أرقام.')}</p>
      <div class="field"><label>${t('البريد الإلكتروني')}</label><input id="fpEmail" type="email" dir="ltr" autocomplete="email" value="${esc(email)}"></div>
      <p class="err" id="fpErr"></p><div class="mfoot"><button class="btn amber" id="fpSend">${icon('send')} ${t('ابعتلي الكود')}</button></div>`;
    $('#fpSend', box).onclick = e => busy(e.currentTarget, async () => {
      email = $('#fpEmail', box).value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('#fpErr', box).textContent = t('اكتب إيميل صحيح.'); return; }
      try { await apiPublic('/auth/reset/send', { email }); } catch (err) { $('#fpErr', box).textContent = err.message; return; }
      step2();
    });
  };
  const step2 = () => {
    box.innerHTML = `<p class="muted small" style="margin-bottom:14px">${t('لو الإيميل مسجّل عندنا، وصلك كود على')} <b class="ltr" data-raw>${esc(email)}</b>. ${t('شوف كمان مجلد Spam.')}</p>
      <div class="field"><label>${t('الكود (6 أرقام)')}</label><input id="fpCode" class="codein" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" placeholder="••••••"></div>
      <div class="field"><label>${t('كلمة المرور الجديدة')}</label><input id="fpPass" type="password" autocomplete="new-password" dir="ltr" minlength="6"><span class="hint">${t('6 أحرف على الأقل')}</span></div>
      <p class="err" id="fpErr"></p>
      <div class="mfoot"><button class="btn amber" id="fpGo">${icon('check')} ${t('غيّر كلمة المرور')}</button><button class="btn ghost" id="fpBack">${t('ما وصلنيش كود')}</button></div>`;
    const ci = $('#fpCode', box);
    ci.oninput = () => { ci.value = ci.value.replace(/\D/g, '').slice(0, 6); };
    setTimeout(() => ci.focus(), 50);
    $('#fpBack', box).onclick = step1;
    $('#fpGo', box).onclick = e => busy(e.currentTarget, async () => {
      const code = ci.value, password = $('#fpPass', box).value;
      if (!/^\d{6}$/.test(code)) { $('#fpErr', box).textContent = t('اكتب الكود كامل (6 أرقام).'); return; }
      if (password.length < 6) { $('#fpErr', box).textContent = t('كلمة المرور لازم 6 أحرف على الأقل.'); return; }
      try { await apiPublic('/auth/reset/confirm', { email, code, password }); } catch (err) { $('#fpErr', box).textContent = err.message; return; }
      toast(t('تم تغيير كلمة المرور ✅'));
      try { const c = await signInWithEmailAndPassword(auth, email, password); m.close(); await go(c.user); }
      catch (err) { m.close(); $('#lEmail').value = email; $('#lErr').textContent = errText(err); }
    });
  };
  step1();
};

$('#regForm').onsubmit = e => {
  e.preventDefault();
  const name = $('#rName').value.trim(), phone = $('#rPhone').value.trim(),
        email = $('#rEmail').value.trim(), pass = $('#rPass').value;
  $('#rErr').textContent = '';
  if (!name || !phone || !email) { $('#rErr').textContent = 'عبّي كل الحقول.'; return; }
  if (pass.length < 6) { $('#rErr').textContent = 'كلمة المرور لازم 6 أحرف على الأقل.'; return; }
  busy($('#rBtn'), async () => {
    registering = true;
    try {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, { displayName: name });
      // التاجر ينسجل دايماً merchant وغير مفعّل — القواعد تمنع غير هكي
      await ensureUserDoc(c.user, { displayName: name, phone });
      // كود تأكيد البريد (6 أرقام) من السيرفر
      try { await apiPost('/auth/verify/send'); sessionStorage.setItem('malafy.vsent', Date.now()); } catch (e) { console.warn(e); }
      location.replace('app.html');
    } catch (err) { registering = false; $('#rErr').textContent = errText(err); }
  });
};
</script>
</body>
</html>
