<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B19">
<title>ملفي — تسجيل الدخول</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="auth">
  <section class="auth-art">
    <div>
      <div id="bigLogo"></div>
      <h1>ملفي</h1>
      <p>إدارة وبيع المنتجات الرقمية في مكان واحد: الحسابات وملفاتها، الأكواد، الأرقام، والزباين.</p>
    </div>
    <div class="feats" id="feats"></div>
    <div id="ridge"></div>
  </section>

  <section class="auth-form">
    <div class="card glow">
      <div class="tabs" style="margin-bottom:22px" role="tablist">
        <button class="on" data-tab="login" role="tab">تسجيل الدخول</button>
        <button data-tab="register" role="tab">حساب تاجر جديد</button>
      </div>

      <form id="loginForm" novalidate>
        <h2>أهلاً بعودتك</h2>
        <p class="muted small" style="margin-bottom:20px">ادخل لحسابك وكمّل شغلك.</p>
        <div class="field"><label for="lEmail">البريد الإلكتروني</label><input id="lEmail" type="email" autocomplete="email" dir="ltr" required></div>
        <div class="field"><label for="lPass">كلمة المرور</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></div>
        <p class="err" id="lErr"></p>
        <button class="btn amber full" id="lBtn" type="submit">تسجيل الدخول</button>
        <button class="link" type="button" id="forgot" style="margin-top:14px">نسيت كلمة المرور؟</button>
      </form>

      <form id="regForm" novalidate hidden>
        <h2>حساب تاجر جديد</h2>
        <p class="muted small" style="margin-bottom:20px">بعد التسجيل تختار خطة الاشتراك، والإدارة تفعّل حسابك.</p>
        <div id="regClosed" hidden class="payinfo" style="margin-bottom:14px">التسجيل مغلق حالياً. تواصل مع إدارة المنصة.</div>
        <div class="field"><label for="rName">الاسم أو اسم المتجر</label><input id="rName" autocomplete="name" required></div>
        <div class="field"><label for="rPhone">رقم الواتساب</label><input id="rPhone" type="tel" inputmode="tel" dir="ltr" placeholder="09XXXXXXXX" required></div>
        <div class="field"><label for="rEmail">البريد الإلكتروني</label><input id="rEmail" type="email" autocomplete="email" dir="ltr" required></div>
        <div class="field"><label for="rPass">كلمة المرور</label><input id="rPass" type="password" autocomplete="new-password" dir="ltr" minlength="6" required><span class="hint">6 أحرف على الأقل</span></div>
        <p class="err" id="rErr"></p>
        <button class="btn amber full" id="rBtn" type="submit">إنشاء الحساب</button>
      </form>
    </div>
  </section>
</div>

<script type="module">
import {
  auth, db, $, $$, icon, LOGO, RIDGE, busy, errText, toast,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile,
  onAuthStateChanged, doc, getDoc, setDoc, serverTimestamp
} from './assets/core.js';

$('#bigLogo').innerHTML = LOGO();
$('#ridge').innerHTML = RIDGE;
$('#feats').innerHTML = [['trend', 'أرباح أوضح'], ['bolt', 'تسليم بضغطة'], ['shield', 'بياناتك لك وحدك']]
  .map(([i, t]) => `<div>${icon(i)}<span>${t}</span></div>`).join('');

// لو داخل من قبل نحوله مباشرة
let redirecting = false;
async function go(uid) {
  if (redirecting) return; redirecting = true;
  const s = await getDoc(doc(db, 'users', uid));
  location.replace(s.exists() && s.data().role === 'admin' ? 'admin.html' : 'app.html');
}
let registering = false;
onAuthStateChanged(auth, u => { if (u && !registering) go(u.uid).catch(() => { redirecting = false; }); });

// تبويبات
$$('[data-tab]').forEach(b => b.onclick = () => {
  $$('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  $('#loginForm').hidden = b.dataset.tab !== 'login';
  $('#regForm').hidden = b.dataset.tab !== 'register';
});

// هل التسجيل مفتوح؟
getDoc(doc(db, 'settings', 'platform')).then(s => {
  if (s.exists() && s.data().registrationOpen === false) {
    $('#regClosed').hidden = false; $('#rBtn').disabled = true;
  }
}).catch(() => {});

$('#loginForm').onsubmit = e => {
  e.preventDefault();
  const email = $('#lEmail').value.trim(), pass = $('#lPass').value;
  $('#lErr').textContent = '';
  if (!email || !pass) { $('#lErr').textContent = 'اكتب الإيميل وكلمة المرور.'; return; }
  busy($('#lBtn'), async () => {
    try { const c = await signInWithEmailAndPassword(auth, email, pass); await go(c.user.uid); }
    catch (err) { $('#lErr').textContent = errText(err); }
  });
};

$('#forgot').onclick = async () => {
  const email = $('#lEmail').value.trim();
  if (!email) { $('#lErr').textContent = 'اكتب إيميلك فوق، وبعدين اضغط "نسيت كلمة المرور".'; return; }
  try { await sendPasswordResetEmail(auth, email); toast('بعتنالك رابط استعادة كلمة المرور على الإيميل'); }
  catch (err) { $('#lErr').textContent = errText(err); }
};

$('#regForm').onsubmit = e => {
  e.preventDefault();
  const name = $('#rName').value.trim(), phone = $('#rPhone').value.trim(),
        email = $('#rEmail').value.trim(), pass = $('#rPass').value;
  $('#rErr').textContent = '';
  if (!name || !phone || !email) { $('#rErr').textContent = 'عبّي كل الحقول.'; return; }
  if (pass.length < 6) { $('#rErr').textContent = 'كلمة المرور لازم 6 أحرف على الأقل.'; return; }
  busy($('#rBtn'), async () => {
    registering = true;
    try {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, { displayName: name });
      // التاجر ينسجل دايماً merchant وغير مفعّل — القواعد تمنع غير هكي
      await setDoc(doc(db, 'users', c.user.uid), {
        email: c.user.email, displayName: name, phone,
        role: 'merchant', isActive: false, plan: null, planExpiresAt: null,
        currency: '$', createdAt: serverTimestamp()
      });
      location.replace('app.html');
    } catch (err) { registering = false; $('#rErr').textContent = errText(err); }
  });
};
</script>
</body>
</html>
