<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1C1C">
<title>لوحة التحكم — قرطاسية بولحية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C1C1C;--surface:#242424;--surface-2:#2E2E2E;--surface-3:#383838;
  --line:#3A3A3A;--line-soft:#333;
  --or:#FC7702;--or-dim:#D96500;--or-wash:rgba(252,119,2,.12);--or-glow:rgba(252,119,2,.28);
  --tx:#F5F4F2;--tx-2:#A9A6A1;--tx-3:#75726E;
  --green:#3DBE84;--red:#E5544B;--blue:#4B9BE5;--gold:#F2C94C;
  --r:16px;--r-sm:12px;--e:cubic-bezier(.22,.68,.32,1);--e-out:cubic-bezier(.16,1,.3,1);
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:#111;color:var(--tx);font-size:14px;line-height:1.7;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}
h1,h2,h3{margin:0;font-weight:800;line-height:1.35}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

.app{position:relative;width:100%;max-width:520px;height:100%;margin:0 auto;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 80px rgba(0,0,0,.6)}
.vp{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.vp::-webkit-scrollbar{width:0}

.hd{position:sticky;top:0;z-index:30;background:rgba(28,28,28,.9);backdrop-filter:blur(16px);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line-soft)}
.hd h2{font-size:17px;flex:1}
.hd .live{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx-3);font-weight:600}
.hd .live i{width:7px;height:7px;border-radius:50%;background:var(--tx-3)}
.hd .live.on i{background:var(--green);box-shadow:0 0 8px var(--green);animation:bl 2s infinite}
@keyframes bl{50%{opacity:.35}}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);
  transition:transform .16s var(--e),background .2s;flex:0 0 auto}
.ib:active{transform:scale(.88);background:var(--surface-2)}
.ib.plain{background:none}

.pad{padding:16px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px}
.sh h3{font-size:16px}
.sh button{font-size:12.5px;color:var(--or);font-weight:700}

/* بطاقات الإحصاء */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:16px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi .ki{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:9px}
.kpi b{display:block;font-size:23px;font-weight:800;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--tx-3)}
.kpi.a .ki{background:var(--or-wash);color:var(--or)}
.kpi.b .ki{background:rgba(61,190,132,.12);color:var(--green)}
.kpi.c .ki{background:rgba(75,155,229,.12);color:var(--blue)}
.kpi.d .ki{background:rgba(242,201,76,.12);color:var(--gold)}
.kpi.wide{grid-column:1/-1}
.kpi.wide b{color:var(--or)}

/* صفوف */
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:12px;margin-bottom:10px;width:100%;text-align:start;
  transition:transform .16s var(--e),border-color .2s}
.row:active{transform:scale(.99);border-color:var(--surface-3)}
.row .th{width:52px;height:52px;border-radius:13px;background:linear-gradient(160deg,#FCFCFC,#EDECEA);
  display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.row .th svg{width:76%;height:76%}
.row .mid{flex:1;min-width:0}
.row b{display:block;font-size:13.5px;font-weight:700;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row span{font-size:11.5px;color:var(--tx-3)}
.row .pr{font-size:15px;font-weight:800;color:var(--or);white-space:nowrap}
.row.off{opacity:.5}

.stt{font-size:10.5px;font-weight:800;border-radius:8px;padding:3px 9px;white-space:nowrap}
.s0{background:rgba(75,155,229,.14);color:var(--blue)}
.s1{background:var(--or-wash);color:var(--or)}
.s2{background:rgba(242,201,76,.14);color:var(--gold)}
.s3{background:rgba(61,190,132,.14);color:var(--green)}
.s4{background:rgba(229,84,75,.14);color:var(--red)}
.tagx{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--tx-3)}
.tagx.out{background:rgba(229,84,75,.14);color:var(--red)}
.tagx.low{background:rgba(242,201,76,.14);color:var(--gold)}

/* أزرار */
.btn{width:100%;background:var(--or);color:#fff;border-radius:14px;padding:14px;font-size:14.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 20px -12px var(--or-glow);transition:transform .16s var(--e),background .2s,opacity .2s}
.btn:active{transform:scale(.98);background:var(--or-dim)}
.btn.gh{background:var(--surface);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.gh:active{background:var(--surface-2)}
.btn.rd{background:var(--red);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:13px;border-radius:11px;width:auto}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.load{pointer-events:none}
.lb{display:inline-block;width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* حقول */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--tx-2);margin-bottom:7px}
.inp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:13px;padding:0 13px;transition:border-color .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.inp.bad{border-color:var(--red)}
.inp input,.inp select,.inp textarea{flex:1;background:none;border:0;outline:none;padding:13px 0;font-size:14.5px;width:100%}
.inp textarea{min-height:70px;resize:vertical}
.inp select{appearance:none;color:var(--tx)}
.inp select option{background:var(--surface-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{font-size:11px;color:var(--tx-3);margin-top:5px}

/* شريط سفلي */
.nav{position:absolute;bottom:0;inset-inline:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(36,36,36,.94);backdrop-filter:blur(20px);
  border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-evenly;padding-inline:10px}
.nav button{display:flex;align-items:center;color:var(--tx-3);font-size:12.5px;font-weight:700;
  padding:9px 13px;border-radius:14px;position:relative;gap:0;
  transition:background .26s var(--e),color .22s,gap .26s var(--e),padding .26s var(--e)}
.nav button .lb2{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .3s var(--e),opacity .22s}
.nav button.on{color:var(--or);background:var(--or-wash);gap:7px;padding-inline:15px}
.nav button.on .lb2{max-width:80px;opacity:1}
.nav .nb{position:absolute;top:5px;inset-inline-start:8px;min-width:16px;height:16px;padding:0 4px;
  background:var(--or);color:#fff;border-radius:8px;font-size:9.5px;font-weight:800;display:grid;place-items:center;
  border:2px solid var(--surface)}

/* ورقة منزلقة */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:80;opacity:0;pointer-events:none;
  transition:opacity .26s var(--e);backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;bottom:0;inset-inline:0;z-index:90;background:var(--surface);
  border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .32s var(--e-out);max-height:92%;overflow-y:auto;pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.grab{width:38px;height:4px;border-radius:3px;background:var(--surface-3);margin:0 auto 14px}
.sheet h3{font-size:17px;margin-bottom:4px}
.sheet .sd{color:var(--tx-2);font-size:12.5px;margin:0 0 16px}

/* تنبيه */
.toast{position:absolute;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));inset-inline:16px;z-index:150;
  background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.8);pointer-events:none;
  transform:translateY(120%);opacity:0;transition:transform .26s var(--e-out),opacity .2s}
.toast.on{transform:none;opacity:1}
.toast .ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.ti.ok{background:rgba(61,190,132,.14);color:var(--green)}
.ti.rd{background:rgba(229,84,75,.14);color:var(--red)}
.ti.or{background:var(--or-wash);color:var(--or)}

/* حالات */
.empty{padding:60px 32px;text-align:center}
.empty .er{width:88px;height:88px;border-radius:28px;background:var(--surface);border:1px solid var(--line-soft);
  display:grid;place-items:center;color:var(--tx-3);margin:0 auto 18px}
.empty h3{font-size:16.5px;margin-bottom:8px}
.empty p{color:var(--tx-2);font-size:13px;margin:0 0 22px;line-height:1.8}
.sk{background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:220% 100%;animation:shim 1.4s infinite;border-radius:var(--r);height:74px;margin-bottom:10px}
@keyframes shim{to{background-position:-220% 0}}
.fu{animation:fu .28s var(--e-out) both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* بوابة الدخول */
.gate{position:absolute;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 26px;text-align:center}
.gate .mk{width:76px;height:76px;border-radius:24px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--or);margin-bottom:20px;box-shadow:0 0 40px -14px var(--or-glow)}
.gate h1{font-size:22px;margin-bottom:6px}
.gate p{color:var(--tx-2);font-size:13px;margin:0 0 26px}
.gate .w{width:100%}
.gate.gone{animation:gOut .4s var(--e) forwards}
@keyframes gOut{to{opacity:0;visibility:hidden}}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:8px 15px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line-soft);font-size:12.5px;font-weight:600;color:var(--tx-2);transition:all .2s var(--e)}
.chips button.on{background:var(--or);color:#fff;border-color:var(--or)}

.tl{padding:4px 0}
.tls{display:flex;gap:14px;position:relative;padding-bottom:22px}
.tls:last-child{padding-bottom:0}
.tls::before{content:"";position:absolute;inset-inline-start:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.tls:last-child::before{display:none}
.tls.done::before{background:var(--or)}
.tld{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:transparent;flex:0 0 auto;z-index:1}
.tls.done .tld{background:var(--or);border-color:var(--or);color:#fff}
.tls b{display:block;font-size:13.5px;font-weight:700}
.tls span{font-size:11.5px;color:var(--tx-3)}
.tls:not(.done) b{color:var(--tx-3);font-weight:500}

.sum{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px}
.sum .r{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--tx-2)}
.sum .r b{color:var(--tx);font-weight:700}
.sum .r.tot{border-top:1px dashed var(--line);margin-top:9px;padding-top:12px;font-size:16px;color:var(--tx);font-weight:800}
.sum .r.tot b{color:var(--or);font-size:19px}

.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--or);border-radius:4px;transition:width .5s var(--e-out)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

    orders=s.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render();

}

/* ═══════ التهيئة: الكود ينشئ المجموعات والحقول ═══════ */
async function seed(){
  const btn=$('seedBtn');
  if(btn){btn.classList.add('load');btn.innerHTML='<span class="lb"></span> جارٍ التهيئة...'}
  try{
    let batch=writeBatch(db), n=0;
    const flush=async()=>{ await batch.commit(); batch=writeBatch(db); n=0; };

    for(const c of SEED_CATS){
      batch.set(doc(db,'categories',c.id),{...c,active:true,createdAt:serverTimestamp()},{merge:true});
      if(++n>=400) await flush();
    }
    for(const p of SEED_PRODUCTS){
      const {id,...rest}=p;
      batch.set(doc(db,'products',id),{...rest,createdAt:serverTimestamp()},{merge:true});
      if(++n>=400) await flush();
    }
    for(const pr of SEED_PROMOS){
      const {id,...rest}=pr;
      batch.set(doc(db,'promos',id),rest,{merge:true});
      if(++n>=400) await flush();
    }
    batch.set(doc(db,'settings','store'),{...SEED_SETTINGS,updatedAt:serverTimestamp()},{merge:true});
    await batch.commit();
    toast(`تمت التهيئة: ${SEED_PRODUCTS.length} منتج و${SEED_CATS.length} قسم`);
  }catch(e){
    toast('فشلت التهيئة: '+(e.code||e.message),'rd');
    console.error(e);
  }
  if(btn){btn.classList.remove('load');btn.innerHTML='تهيئة قاعدة البيانات'}
}

/* ═══════ عمليات ═══════ */
async function saveProduct(data,id){
  try{
    if(id){ await updateDoc(doc(db,'products',id),{...data,updatedAt:serverTimestamp()}); toast('تم حفظ التعديل'); }
    else{ await addDoc(collection(db,'products'),{...data,createdAt:serverTimestamp()}); toast('تمت إضافة المنتج'); }
    closeSheet();
  }catch(e){ toast('فشل الحفظ: '+(e.code||e.message),'rd') }
}
async function delProduct(id){
  try{ await deleteDoc(doc(db,'products',id)); toast('تم حذف المنتج'); closeSheet(); }
  catch(e){ toast('فشل الحذف: '+(e.code||e.message),'rd') }
}
async function toggleProduct(id,active){
  try{ await updateDoc(doc(db,'products',id),{active}); toast(active?'المنتج ظاهر الآن':'المنتج مخفي الآن') }
  catch(e){ toast('فشل: '+(e.code||e.message),'rd') }
}
async function saveCat(data,id){
  try{
    if(id) await updateDoc(doc(db,'categories',id),data);
    else await setDoc(doc(db,'categories',data.slug||('c'+Date.now())),{...data,active:true,createdAt:serverTimestamp()});
    toast('تم الحفظ');closeSheet();
  }catch(e){ toast('فشل: '+(e.code||e.message),'rd') }
}
async function delCat(id){
  const used=products.filter(p=>p.cat===id).length;
  if(used){ toast(`لا يمكن الحذف — ${used} منتج داخل هذا القسم`,'rd'); return; }
  try{ await deleteDoc(doc(db,'categories',id)); toast('تم حذف القسم'); closeSheet(); }
  catch(e){ toast('فشل: '+(e.code||e.message),'rd') }
}
async function setStatus(id,s){
  try{
    const o=orders.find(x=>x.id===id);
    const hist=[...(o.statusHistory||[]),{status:s,at:new Date().toISOString()}];
    await updateDoc(doc(db,'orders',id),{status:s,statusHistory:hist,updatedAt:serverTimestamp()});
    toast('تم تحديث حالة الطلب');
  }catch(e){ toast('فشل: '+(e.code||e.message),'rd') }
}
async function saveSettings(data){
  try{ await setDoc(doc(db,'settings','store'),{...data,updatedAt:serverTimestamp()},{merge:true});
    toast('تم حفظ الإعدادات'); closeSheet(); }
  catch(e){ toast('فشل: '+(e.code||e.message),'rd') }
}

      ${o.customer?.note?`<div class="r"><span>ملاحظات</span><b style="max-width:60%;text-align:end">${o.customer.note}</b></div>`:''}
    </div>
    <a class="btn gh" href="https://wa.me/${(o.customer?.phone||'').replace(/^0/,'218')}" target="_blank"
       style="margin-bottom:16px;text-decoration:none">${S(ic.phone,17,2)} تواصل مع الزبون</a>

    <div style="font-size:13px;font-weight:800;margin-bottom:10px">المنتجات</div>
    ${(o.items||[]).map(i=>`<div class="row" style="pointer-events:none">
      <span class="mid"><b>${i.name||i.id}</b><span>الكمية ${i.qty}</span></span>
      <span class="pr"><span class="num">${m((i.price||0)*(i.qty||0))}</span></span></div>`).join('')}

    <div class="sum" style="margin:14px 0 18px">
      <div class="r"><span>المنتجات</span><b><span class="num">${m(o.subtotal)}</span> د.ل</b></div>
      ${o.discount?`<div class="r"><span>الخصم</span><b>− <span class="num">${m(o.discount)}</span> د.ل</b></div>`:''}
      <div class="r"><span>التوصيل</span><b><span class="num">${m(o.shipping)}</span> د.ل</b></div>
      <div class="r tot"><span>الإجمالي</span><b><span class="num">${m(o.total)}</span> د.ل</b></div>
    </div>

    <div style="font-size:13px;font-weight:800;margin-bottom:10px">حالة الطلب</div>
    <div class="tl" style="margin-bottom:16px">
      ${st===4?'<div class="tls"><span class="tld"></span><div><b style="color:var(--red)">تم إلغاء الطلب</b></div></div>'
      :STEPS.map((s,i)=>`<div class="tls ${i<=st?'done':''}">
        <span class="tld">${S(ic.check,12,3.4)}</span><div><b>${s}</b>
        <span>${i<st?'تم':i===st?'الحالة الحالية':'قادم'}</span></div></div>`).join('')}
    </div>

    ${st<4?`
    <div style="font-size:13px;font-weight:800;margin-bottom:10px">تغيير الحالة</div>
    <div class="chips" style="padding:0 0 14px">
      ${STEPS.map((s,i)=>`<button class="${st===i?'on':''}" data-setst="${o.id}|${i}">${s}</button>`).join('')}
    </div>
    <button class="btn gh" data-setst="${o.id}|4" style="color:var(--red)">إلغاء الطلب</button>`:''}
    <div style="height:8px"></div>`);
}

function settingsSheet(){
  openSheet(`
    <h3>إعدادات المتجر</h3><p class="sd">تنعكس مباشرة على تطبيق الزبون</p>
    <div class="fld"><label>اسم المتجر</label><div class="inp"><input id="sName" value="${settings.name||''}"></div></div>
    <div class="fld"><label>اسم الشركة</label><div class="inp"><input id="sCompany" value="${settings.company||''}"></div></div>
    <div class="fld"><label>المدينة</label><div class="inp"><input id="sCity" value="${settings.city||''}"></div></div>
    <div class="two">
      <div class="fld"><label>هاتف المحل</label><div class="inp"><input id="sPhone" value="${settings.phone||''}" dir="ltr" style="text-align:start"></div></div>
      <div class="fld"><label>واتساب (بمقدمة 218)</label><div class="inp"><input id="sWa" value="${settings.whatsapp||''}" dir="ltr" style="text-align:start"></div></div>
    </div>
    <div class="two">
      <div class="fld"><label>سعر التوصيل</label><div class="inp"><input id="sShip" type="number" step="1" value="${settings.shipCost??15}"></div></div>
      <div class="fld"><label>مجاني فوق</label><div class="inp"><input id="sFree" type="number" step="10" value="${settings.freeShipAt??250}"></div></div>
    </div>
    <div class="fld"><label>ساعات العمل</label><div class="inp"><input id="sHours" value="${settings.hours||''}"></div></div>
    <div class="fld"><label>رمز دخول اللوحة</label><div class="inp"><input id="sPass" value="${settings.adminPass||''}" dir="ltr" style="text-align:start"></div>
      <p class="hint">غيّره من الافتراضي. هذا حاجز بسيط لا بديل عن قواعد الأمان.</p></div>
    <button class="btn" id="saveSet">حفظ الإعدادات</button><div style="height:8px"></div>`);
  $('saveSet').onclick=()=>saveSettings({
    name:$('sName').value.trim(), company:$('sCompany').value.trim(), city:$('sCity').value.trim(),
    phone:$('sPhone').value.trim(), whatsapp:$('sWa').value.trim(),
    shipCost:+$('sShip').value||0, freeShipAt:+$('sFree').value||0,
    hours:$('sHours').value.trim(), adminPass:$('sPass').value.trim()||'bolhia2026'
  });
}

/* ═══════ التنقّل ═══════ */
const NAV=[
  {p:'dash',t:'الرئيسية',i:'chart'},
  {p:'products',t:'المنتجات',i:'tag'},
  {p:'orders',t:'الطلبات',i:'box'},
  {p:'settings',t:'الإعدادات',i:'gear'}
];
function render(){
  $('vp').innerHTML=P[page]?P[page]():'';
  const pend=orders.filter(o=>o.status===0).length;
  $('nav').innerHTML=NAV.map(n=>{
    const b=n.p==='orders'&&pend?`<i class="nb">${pend}</i>`:'';
    return `<button class="${page===n.p?'on':''}" data-nav="${n.p}">
      <span style="display:flex;position:relative">${S(ic[n.i],21,2)}${b}</span>
      <span class="lb2">${n.t}</span></button>`;
  }).join('');
}

/* ═══════ الأحداث ═══════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-act],[data-prod],[data-order],[data-cat],[data-fc],[data-fs],[data-setst]');
  if(!t)return;
  const d=t.dataset;
  if(d.nav){page=d.nav;closeSheet();render();$('vp').scrollTop=0;return}
  if(d.fc){filterCat=d.fc;render();return}
  if(d.fs){filterSt=d.fs;render();return}
  if(d.prod){const p=products.find(x=>x.id===d.prod);if(p)productSheet(p);return}
  if(d.cat){const c=cats.find(x=>x.id===d.cat);if(c)catSheet(c);return}
  if(d.order){const o=orders.find(x=>x.id===d.order);if(o)orderSheet(o);return}
  if(d.setst){const [id,s]=d.setst.split('|');setStatus(id,+s);closeSheet();return}
  if(d.act==='newProduct'){ if(!cats.length){toast('أضف قسمًا أولًا','rd');return} productSheet(null);return}
  if(d.act==='newCat'){catSheet(null);return}
  if(d.act==='editSettings'){settingsSheet();return}
  if(d.act==='seed'){seed();return}
  if(d.act==='reload'){location.reload();return}
  if(d.act==='lowstock'){page='products';filterCat='all';render();
    setTimeout(()=>toast(`${products.filter(p=>(p.stock||0)<10).length} منتج يحتاج تعبئة`,'or'),200);return}
  if(d.act==='logout'){sessionStorage.removeItem('bs_admin');location.reload();return}
});
$('scrim').onclick=closeSheet;
document.addEventListener('click',e=>{ if(e.target.closest('#seedBtn')&&!e.target.closest('[data-act]'))seed() });

/* ═══════ البوابة ═══════ */
function enter(){
  $('gate').classList.add('gone');
  setTimeout(()=>$('gate').remove(),420);
  listen();render();
}
$('doGate').onclick=async()=>{
  const v=$('pass').value.trim();
  let real='bolhia2026';
  try{ const s=await getDoc(doc(db,'settings','store')); if(s.exists()&&s.data().adminPass) real=s.data().adminPass; }catch(e){}
  if(v===real){ sessionStorage.setItem('bs_admin','1'); enter(); }
  else toast('رمز غير صحيح','rd');
};
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter')$('doGate').click() });

if(sessionStorage.getItem('bs_admin')) enter(); else render();
</script>
</body>
</html>
