<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>لوحة التحكم — قرطاسية بولحية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171717;--panel:#1F1F1F;--card:#242424;--card-2:#2B2B2B;--card-3:#343434;
  --line:#333;--line-2:#3D3D3D;
  --or:#FC7702;--or-dim:#D96500;--or-wash:rgba(252,119,2,.11);--or-glow:rgba(252,119,2,.3);
  --tx:#F2F1EF;--tx-2:#A5A29D;--tx-3:#726F6B;
  --green:#3DBE84;--red:#E5544B;--blue:#4B9BE5;--gold:#F2C94C;--purple:#9B7EDE;
  --r:16px;--sb:246px;--e:cubic-bezier(.22,.68,.32,1);--e-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.7;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx)}
h1,h2,h3,h4{margin:0;font-weight:800;line-height:1.35}
ul{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--card-3);border-radius:4px}

.shell{display:flex;height:100%;overflow:hidden}
.side{width:var(--sb);flex:0 0 auto;background:var(--panel);border-inline-start:1px solid var(--line);
  display:flex;flex-direction:column;transition:transform .3s var(--e);z-index:60}
.logo{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
.logo .mk{width:42px;height:42px;border-radius:14px;background:var(--or-wash);border:1px solid rgba(252,119,2,.28);
  display:grid;place-items:center;color:var(--or);flex:0 0 auto}
.logo b{display:block;font-size:15.5px;font-weight:900;line-height:1.25}
.logo em{display:block;font-style:normal;font-size:10.5px;color:var(--tx-3);line-height:1.3}
.snav{flex:1;overflow-y:auto;padding:4px 10px 14px}
.snav button{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--tx-2);font-size:13.5px;font-weight:600;text-align:start;margin-bottom:2px;position:relative;
  transition:background .18s,color .18s}
.snav button:hover{background:var(--card);color:var(--tx)}
.snav button.on{background:var(--or-wash);color:var(--or);font-weight:700}
.snav button.on::before{content:"";position:absolute;inset-inline-end:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--or);border-radius:3px;box-shadow:0 0 10px var(--or)}
.snav .cnt{margin-inline-start:auto;background:var(--or);color:#fff;font-size:10px;font-weight:800;
  border-radius:7px;padding:1px 7px;min-width:20px;text-align:center}
.snav .sec{font-size:10px;font-weight:800;color:var(--tx-3);letter-spacing:.12em;padding:14px 12px 6px}
.promo-box{margin:0 12px 14px;background:linear-gradient(150deg,#3A2410,#242424);border:1px solid rgba(252,119,2,.22);
  border-radius:var(--r);padding:15px;text-align:center}
.promo-box b{display:block;font-size:13px;font-weight:800;margin-bottom:3px}
.promo-box p{margin:0 0 11px;font-size:11px;color:var(--tx-2);line-height:1.6}
.promo-box button{width:100%;background:var(--or);color:#fff;border-radius:10px;padding:8px;font-size:12px;font-weight:700}
.promo-box button:hover{background:var(--or-dim)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{height:66px;flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px}
.burger{display:none}
.gsearch{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;background:var(--bg);
  border:1px solid var(--line);border-radius:13px;padding:0 13px;transition:border-color .2s,box-shadow .2s}
.gsearch:focus-within{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.gsearch input{flex:1;background:none;border:0;outline:none;padding:11px 0;font-size:13.5px}
.gsearch input::placeholder{color:var(--tx-3)}
.gsearch kbd{font-family:inherit;font-size:10.5px;color:var(--tx-3);background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.spacer{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);
  color:var(--tx-2);position:relative;transition:background .18s,color .18s,transform .15s var(--e);flex:0 0 auto}
.ib:hover{background:var(--card-2);color:var(--tx)}
.ib:active{transform:scale(.9)}
.ib .bdg{position:absolute;top:-4px;inset-inline-start:-4px;min-width:19px;height:19px;padding:0 5px;
  background:var(--or);color:#fff;border-radius:10px;font-size:10px;font-weight:800;display:grid;place-items:center;
  border:2px solid var(--panel)}
.me{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 10px;border-radius:13px;transition:background .18s}
.me:hover{background:var(--card)}
.me .av{width:38px;height:38px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-2);
  display:grid;place-items:center;color:var(--or);flex:0 0 auto}
.me .mi{text-align:start;min-width:0}
.me .mi b{display:block;font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap}
.me .mi span{display:block;font-size:10.5px;color:var(--tx-3);line-height:1.3}
.view{flex:1;overflow-y:auto;padding:22px 20px 30px}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:22px;margin-bottom:3px}
.ph p{margin:0;font-size:13px;color:var(--tx-2)}
.ph .acts{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.range{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 13px;font-size:12.5px;color:var(--tx-2);font-weight:600}
.range select{background:none;border:0;outline:none;font-weight:700;color:var(--tx);cursor:pointer;font-size:12.5px}
.range select option{background:var(--card-2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  transition:border-color .22s,transform .2s var(--e)}
.kpi:hover{border-color:var(--line-2);transform:translateY(-2px)}
.kpi .kt{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kpi .kt span{font-size:12px;color:var(--tx-2);font-weight:600}
.kpi .ki{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}
.kpi b{display:block;font-size:25px;font-weight:800;line-height:1.2;margin-bottom:7px}
.kpi b small{font-size:12.5px;font-weight:700;color:var(--tx-2)}
.kpi .dt{font-size:11px;color:var(--tx-3);display:flex;align-items:center;gap:5px}
.kpi .dt i{font-style:normal;font-weight:800;display:flex;align-items:center;gap:2px}
.kpi .dt i.up{color:var(--green)}
.kpi .dt i.dn{color:var(--red)}
.k1 .ki{background:var(--or-wash);color:var(--or)}
.k2 .ki{background:rgba(75,155,229,.12);color:var(--blue)}
.k3 .ki{background:rgba(61,190,132,.12);color:var(--green)}
.k4 .ki{background:rgba(242,201,76,.12);color:var(--gold)}
.k5 .ki{background:rgba(155,126,222,.12);color:var(--purple)}
.k6 .ki{background:rgba(229,84,75,.12);color:var(--red)}

.grid{display:grid;gap:13px;margin-bottom:16px}
.g-2{grid-template-columns:1.35fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-21{grid-template-columns:2fr 1fr}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}
.ch h3{font-size:14.5px}
.ch .lnk{font-size:12px;color:var(--or);font-weight:700;display:flex;align-items:center;gap:4px}
.ch .lnk:hover{opacity:.75}
.cb{padding:15px 17px;flex:1}
.cb.flush{padding:0}

.tw{overflow-x:auto}
thead th{font-size:11.5px;font-weight:700;color:var(--tx-3);text-align:start;padding:11px 15px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
tbody td{padding:12px 15px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .16s}
tbody tr:hover{background:var(--card-2)}
tbody tr.clk{cursor:pointer}
.tprod{display:flex;align-items:center;gap:11px;min-width:0}
.tprod .th{width:40px;height:40px;border-radius:11px;background:linear-gradient(160deg,#FCFCFC,#EDECEA);
  display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.tprod .th svg{width:78%;height:78%}
.tprod .th img{width:100%;height:100%;object-fit:cover;display:block}
.tprod b{display:block;font-size:13px;font-weight:600;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:230px}
.tprod span{font-size:11px;color:var(--tx-3)}
.money{font-weight:800;color:var(--or);white-space:nowrap}

.st{font-size:11px;font-weight:800;border-radius:8px;padding:4px 10px;white-space:nowrap;display:inline-block}
.s0{background:rgba(75,155,229,.13);color:var(--blue)}
.s1{background:var(--or-wash);color:var(--or)}
.s2{background:rgba(242,201,76,.13);color:var(--gold)}
.s3{background:rgba(61,190,132,.13);color:var(--green)}
.s4{background:rgba(229,84,75,.13);color:var(--red)}
.pill{font-size:10.5px;font-weight:700;border-radius:7px;padding:2px 8px;background:var(--card-2);color:var(--tx-2);display:inline-block}
.pill.out{background:rgba(229,84,75,.13);color:var(--red)}
.pill.low{background:rgba(242,201,76,.13);color:var(--gold)}
.pill.ok{background:rgba(61,190,132,.13);color:var(--green)}

.btn{background:var(--or);color:#fff;border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 20px -12px var(--or-glow);transition:background .2s,transform .15s var(--e)}
.btn:hover{background:var(--or-dim)}
.btn:active{transform:scale(.97)}
.btn.gh{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.gh:hover{background:var(--card-2)}
.btn.rd{background:var(--red);box-shadow:none}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.load{pointer-events:none}
.lb{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--tx-3);
  transition:background .18s,color .18s}
.icb:hover{background:var(--card-3);color:var(--tx)}
.icb.dg:hover{background:rgba(229,84,75,.14);color:var(--red)}

.fld{margin-bottom:15px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--tx-2);margin-bottom:7px}
.inp{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:0 13px;transition:border-color .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.inp input,.inp select,.inp textarea{flex:1;background:none;border:0;outline:none;padding:11px 0;font-size:13.5px;width:100%}
.inp select{appearance:none;cursor:pointer}
.inp select option{background:var(--card-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:11px;color:var(--tx-3);margin-top:5px}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px}
.chk input{width:19px;height:19px;accent-color:var(--or);cursor:pointer}

.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.chip{padding:8px 15px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--tx-2);transition:all .2s var(--e);white-space:nowrap}
.chip:hover{border-color:var(--line-2);color:var(--tx)}
.chip.on{background:var(--or);color:#fff;border-color:var(--or)}
.fsearch{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;min-width:220px;flex:1;max-width:320px}
.fsearch input{flex:1;background:none;border:0;outline:none;padding:9px 0;font-size:13px}

.chartbox{padding:6px 4px}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:11px;min-width:158px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .lt{flex:1;color:var(--tx-2)}
.legend .lv{font-weight:800;font-size:12.5px}
.legend .lp{color:var(--tx-3);font-size:11.5px;min-width:34px;text-align:end}

.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .th{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#FCFCFC,#EDECEA);
  display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.lrow .th svg{width:78%;height:78%}
.lrow .th img{width:100%;height:100%;object-fit:cover;display:block}
.lrow .mid{flex:1;min-width:0}
.lrow b{display:block;font-size:13px;font-weight:600;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.lrow span{font-size:11px;color:var(--tx-3)}
.qstat{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.qstat:last-child{border-bottom:0}
.qstat .qi{width:38px;height:38px;border-radius:12px;background:var(--card-2);display:grid;place-items:center;
  color:var(--or);flex:0 0 auto}
.qstat .qm{flex:1}
.qstat .qm span{display:block;font-size:11.5px;color:var(--tx-3);line-height:1.4}
.qstat .qm b{display:block;font-size:16px;font-weight:800;line-height:1.4}

.rev{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}
.rev .ra{width:38px;height:38px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;
  color:var(--tx-2);font-weight:800;font-size:14px;flex:0 0 auto}
.rev .rm{flex:1;min-width:0}
.rev .rt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.rev b{font-size:13px;font-weight:700}
.rev time{font-size:10.5px;color:var(--tx-3);white-space:nowrap}
.rev .rs{display:flex;gap:1px;color:var(--gold);margin-bottom:4px}
.rev p{margin:0;font-size:12px;color:var(--tx-2);line-height:1.65}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:100;opacity:0;pointer-events:none;
  transition:opacity .25s var(--e);backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;inset-inline-start:50%;transform:translate(50%,-50%) scale(.94);opacity:0;z-index:110;
  width:min(560px,calc(100vw - 32px));max-height:88vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line-2);border-radius:22px;pointer-events:none;
  transition:transform .3s var(--e-out),opacity .22s}
.modal.on{transform:translate(50%,-50%) scale(1);opacity:1;pointer-events:auto}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 0}
.mh h3{font-size:17px;margin-bottom:3px}
.mh p{margin:0;font-size:12.5px;color:var(--tx-2)}
.mb{padding:18px 22px}
.mf{padding:0 22px 20px;display:flex;gap:10px}
.mf .btn{flex:1}

.toast{position:fixed;bottom:24px;inset-inline-start:24px;z-index:200;background:var(--card-2);
  border:1px solid var(--line-2);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:11px;
  font-size:13.5px;font-weight:600;box-shadow:0 20px 48px -14px rgba(0,0,0,.85);pointer-events:none;
  transform:translateY(140%);opacity:0;transition:transform .3s var(--e-out),opacity .22s;max-width:360px}
.toast.on{transform:none;opacity:1}
.toast .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.ti.ok{background:rgba(61,190,132,.14);color:var(--green)}
.ti.rd{background:rgba(229,84,75,.14);color:var(--red)}
.ti.or{background:var(--or-wash);color:var(--or)}

.empty{padding:56px 30px;text-align:center}
.empty .er{width:82px;height:82px;border-radius:26px;background:var(--card-2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--tx-3);margin:0 auto 17px}
.empty h3{font-size:16px;margin-bottom:7px}
.empty p{color:var(--tx-2);font-size:13px;margin:0 auto 20px;line-height:1.8;max-width:38ch}
.sk{background:linear-gradient(100deg,var(--card) 30%,var(--card-2) 50%,var(--card) 70%);
  background-size:220% 100%;animation:shim 1.4s infinite;border-radius:var(--r)}
@keyframes shim{to{background-position:-220% 0}}
.fu{animation:fu .3s var(--e-out) both}
@keyframes fu{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.bar{height:6px;border-radius:4px;background:var(--card-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--or);border-radius:4px;transition:width .6s var(--e-out)}
.foot{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 0;
  font-size:11.5px;color:var(--tx-3);border-top:1px solid var(--line);margin-top:18px}


/* ─── قاصّ الصور ─── */
.picker{display:flex;gap:12px;align-items:center}
.pick-prev{width:76px;height:76px;border-radius:14px;background:linear-gradient(160deg,#FCFCFC,#EDECEA);
  display:grid;place-items:center;overflow:hidden;flex:0 0 auto;position:relative;border:1px solid var(--line)}
.pick-prev img{width:100%;height:100%;object-fit:cover;display:block}
.pick-prev svg{width:78%;height:78%}
.pick-acts{flex:1;display:flex;flex-direction:column;gap:8px}
.pick-acts .row2{display:flex;gap:8px}
.crop-stage{
  position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:0 auto 14px;
  background:#0E0E0E;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;
  border:1px solid var(--line-2);
}
.crop-stage.drag{cursor:grabbing}
.crop-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.crop-mask{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(252,119,2,.9), inset 0 0 0 2000px rgba(0,0,0,0)}
.crop-grid{position:absolute;inset:0;pointer-events:none;opacity:.35}
.crop-grid i{position:absolute;background:#fff}
.crop-grid i:nth-child(1){left:0;right:0;top:33.33%;height:1px}
.crop-grid i:nth-child(2){left:0;right:0;top:66.66%;height:1px}
.crop-grid i:nth-child(3){top:0;bottom:0;left:33.33%;width:1px}
.crop-grid i:nth-child(4){top:0;bottom:0;left:66.66%;width:1px}
.zoomrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.zoomrow input[type=range]{flex:1;accent-color:var(--or);height:4px}
.zoomrow span{color:var(--tx-3);display:flex}
.ratios{display:flex;gap:7px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.crop-note{font-size:11.5px;color:var(--tx-3);text-align:center;margin:0 0 14px;line-height:1.7}

.gate{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:20px}
.gate .box{width:min(400px,100%);text-align:center}
.gate .mk{width:78px;height:78px;border-radius:26px;background:var(--card);border:1px solid var(--line-2);
  display:grid;place-items:center;color:var(--or);margin:0 auto 20px;box-shadow:0 0 50px -16px var(--or-glow)}
.gate h1{font-size:22px;margin-bottom:6px}
.gate p{color:var(--tx-2);font-size:13px;margin:0 0 26px}
.gate.gone{animation:gOut .4s var(--e) forwards}
@keyframes gOut{to{opacity:0;visibility:hidden}}

@media (max-width:1200px){.g-4{grid-template-columns:repeat(2,1fr)}.g-2,.g-21{grid-template-columns:1fr}}
@media (max-width:980px){.g-3{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{position:fixed;inset-block:0;inset-inline-end:0;transform:translateX(-100%)}
  .side.open{transform:none;box-shadow:-24px 0 60px rgba(0,0,0,.6)}
  .burger{display:grid}
  .gsearch kbd,.me .mi{display:none}
  .view{padding:16px 14px 24px}
  .top{padding:0 14px;gap:10px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two,.three{grid-template-columns:1fr}
  .ph h1{font-size:19px}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

function stats(d=days){
  const inR=orders.filter(o=>inDays(o,d)&&o.status!==4);
  const prev=orders.filter(o=>{const t=dOf(o);if(!t||o.status===4)return false;
    const a=(Date.now()-t.getTime())/864e5;return a>d&&a<=d*2});
  const sum=a=>a.reduce((x,o)=>x+(o.total||0),0);
  const units=a=>a.reduce((x,o)=>x+(o.items||[]).reduce((y,i)=>y+(i.qty||0),0),0);
  const ph=a=>new Set(a.map(o=>o.customer?.phone).filter(Boolean));
  const before=new Set(orders.filter(o=>{const t=dOf(o);return t&&(Date.now()-t.getTime())/864e5>d})
    .map(o=>o.customer?.phone).filter(Boolean));
  const newC=[...ph(inR)].filter(p=>!before.has(p)).length;
  const pct=(a,b)=>b?Math.round(((a-b)/b)*1000)/10:(a?100:0);
  return {rev:sum(inR),revP:pct(sum(inR),sum(prev)),ord:inR.length,ordP:pct(inR.length,prev.length),
    newC,newCP:pct(newC,[...ph(prev)].length),
    avg:inR.length?sum(inR)/inR.length:0,avgP:pct(inR.length?sum(inR)/inR.length:0,prev.length?sum(prev)/prev.length:0),
    units:units(inR),unitsP:pct(units(inR),units(prev)),cust:ph(orders).size};
}
function series(d=days){
  const out=[];
  for(let i=d-1;i>=0;i--){
    const day=new Date(Date.now()-i*864e5),key=day.toDateString();
    out.push({label:`${day.getDate()}/${day.getMonth()+1}`,
      v:orders.filter(o=>{const t=dOf(o);return t&&t.toDateString()===key&&o.status!==4})
        .reduce((a,o)=>a+(o.total||0),0)});
  }
  return out;
}
function topSelling(n=5){
  const mp={};
  orders.filter(o=>o.status!==4).forEach(o=>(o.items||[]).forEach(i=>{
    if(!mp[i.id])mp[i.id]={id:i.id,name:i.name||i.id,qty:0,rev:0};
    mp[i.id].qty+=i.qty||0;mp[i.id].rev+=(i.price||0)*(i.qty||0)}));
  return Object.values(mp).sort((a,b)=>b.qty-a.qty).slice(0,n);
}
function customers(){
  const mp={};
  orders.forEach(o=>{const p=o.customer?.phone;if(!p)return;
    if(!mp[p])mp[p]={phone:p,name:o.customer?.name||'زبون',city:o.customer?.city||'',
      orders:0,spent:0,last:null,cancelled:0};
    mp[p].orders++;
    if(o.status===4)mp[p].cancelled++;else mp[p].spent+=o.total||0;
    const t=dOf(o);if(t&&(!mp[p].last||t>mp[p].last))mp[p].last=t;
    if(o.customer?.name)mp[p].name=o.customer.name});
  return Object.values(mp).sort((a,b)=>b.spent-a.spent);
}

function lineChart(data,h=210){
  if(!data.length||data.every(d=>!d.v))
    return `<div style="height:${h}px;display:grid;place-items:center;color:var(--tx-3);font-size:12.5px;text-align:center">
      <div>${S(ic.chart,32,1.4)}<div style="margin-top:10px">ما في مبيعات في هذه الفترة</div></div></div>`;
  const w=680,pl=46,pr=10,pt=14,pb=28;
  const max=Math.max(...data.map(d=>d.v))*1.18||100,iw=w-pl-pr,ih=h-pt-pb;
  const X=i=>pl+(iw*i)/Math.max(1,data.length-1), Y=v=>pt+ih-(ih*v)/max;
  const pts=data.map((d,i)=>[X(i),Y(d.v)]);
  const path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area=`${path} L${X(data.length-1).toFixed(1)} ${pt+ih} L${pl} ${pt+ih} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FC7702" stop-opacity=".34"/><stop offset="100%" stop-color="#FC7702" stop-opacity="0"/></linearGradient></defs>
    ${Array.from({length:5},(_,i)=>{const y=pt+ih-(ih*i)/4,v=(max*i)/4;
      return `<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="#2F2F2F" stroke-width="1"/>
      <text x="${pl-8}" y="${y+4}" fill="#726F6B" font-size="10" text-anchor="end" font-family="Cairo" direction="ltr">${v>=1000?(v/1000).toFixed(1)+'K':Math.round(v)}</text>`}).join('')}
    <path d="${area}" fill="url(#ga)"/>
    <path d="${path}" fill="none" stroke="#FC7702" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="#171717" stroke="#FC7702" stroke-width="2.2"><title>${data[i].label}: ${m(data[i].v)}</title></circle>`).join('')}
    ${data.map((d,i)=>(data.length<=10||i%Math.ceil(data.length/8)===0)
      ?`<text x="${X(i).toFixed(1)}" y="${h-8}" fill="#726F6B" font-size="10" text-anchor="middle" font-family="Cairo" direction="ltr">${d.label}</text>`:'').join('')}
  </svg>`;
}
function donut(parts,total){

  const segs=parts.filter(p=>p.v>0).map(p=>{
    const f=total?p.v/total:0,len=C*f,off=C*acc;acc+=f;
    return `<circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="${p.c}" stroke-width="19"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${sz/2} ${sz/2})"><title>${p.t}: ${p.v}</title></circle>`}).join('');
  return `<svg viewBox="0 0 ${sz} ${sz}" style="width:170px;height:170px;flex:0 0 auto">
    <circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="#2B2B2B" stroke-width="19"/>${segs}
    <text x="${sz/2}" y="${sz/2-2}" fill="#F2F1EF" font-size="26" font-weight="800" text-anchor="middle" font-family="Cairo" direction="ltr">${total}</text>

}

  return `<div class="ph"><div><h1>المخزون</h1><p>حدّ التنبيه الحالي: أقل من ${lowAt()} قطعة</p></div>

    ${kpi('k4','alert','كمية منخفضة',`<span class="num">${low.length}</span>`,null,'منتج')}

    ${kpi('k4','chart','متوسط الطلب',`<span class="num">${m(k.avg)}</span>`,k.avgP,cur())}

        <tbody>${top.map((t,i)=>`<tr><td class="num" style="color:var(--tx-3)">${i+1}</td><td><b>${t.name}</b></td>

function sysAlerts(){
  const a=[];
  const out=products.filter(p=>(p.stock||0)===0).length;
  const low=products.filter(p=>(p.stock||0)>0&&(p.stock||0)<lowAt()).length;
  const pend=orders.filter(o=>(o.status??0)===0).length;
  if(pend)a.push({t:`${pend} طلب ينتظر المراجعة`,d:'راجعها وحوّلها لقيد التجهيز',i:'cart',c:'var(--or)',bg:'var(--or-wash)',nav:'orders'});
  if(out)a.push({t:`${out} منتج نفد من المخزون`,d:'الزبون يشوفه غير متوفّر',i:'alert',c:'var(--red)',bg:'rgba(229,84,75,.12)',nav:'stock'});
  if(low)a.push({t:`${low} منتج كميته منخفضة`,d:`أقل من ${lowAt()} قطعة`,i:'layers',c:'var(--gold)',bg:'rgba(242,201,76,.12)',nav:'stock'});
  if(!products.length)a.push({t:'ما في منتجات في المتجر',d:'أضف منتجاتك ليبدأ البيع',i:'box',c:'var(--blue)',bg:'rgba(75,155,229,.12)',nav:'products'});
  if(settings.adminPass==='bolhia2026')a.push({t:'رمز الدخول ما زال الافتراضي',d:'غيّره من الإعدادات فورًا',i:'shield',c:'var(--red)',bg:'rgba(229,84,75,.12)',nav:'settings'});
  return a;
}

/* ═══════════════════════════════════════════════
   قاصّ الصور — رفع من الهاتف مع تكبير وتحريك وقصّ
   ═══════════════════════════════════════════════ */
function openCropper(file, onDone, ratio){
  ratio = ratio || 1;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => cropUI(img, onDone, ratio);
    img.onerror = () => toast('تعذّر قراءة الصورة','rd');
    img.src = reader.result;
  };
  reader.onerror = () => toast('تعذّر قراءة الملف','rd');
  reader.readAsDataURL(file);
}

function cropUI(img, onDone, ratio){
  modal(`<div class="mh"><div><h3>ضبط الصورة</h3>
    <p>حرّك الصورة بإصبعك، وكبّرها بالشريط أو بإصبعين</p></div>
    <button class="icb" data-close="1">${S(ic.x,18,2.2)}</button></div>
  <div class="mb">
    <div class="ratios">
      <button class="chip on" data-ratio="1">مربّع 1:1</button>
      <button class="chip" data-ratio="1.3333">أفقي 4:3</button>
      <button class="chip" data-ratio="0.75">رأسي 3:4</button>
    </div>
    <div class="crop-stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="crop-grid"><i></i><i></i><i></i><i></i></div>
      <div class="crop-mask"></div>
    </div>
    <div class="zoomrow">
      <span>${S(ic.search,15,2.2)}</span>
      <input type="range" id="zoom" min="100" max="400" value="100">
      <span style="font-size:11.5px;font-family:inherit" id="zv">100%</span>
    </div>
    <p class="crop-note">الجزء داخل الإطار البرتقالي هو ما سيظهر في المتجر.
      كل صور المنتجات تُحفَظ بنفس المقاس فتظهر متناسقة.</p>
  </div>
  <div class="mf">
    <button class="btn gh" data-close="1">إلغاء</button>
    <button class="btn" id="cropSave">${S(ic.check,16,2.6)} حفظ الصورة</button>
  </div>`);

  const stage=$('stage'), cv=$('cv'), ctx=cv.getContext('2d');
  let R=ratio, sw=0, sh=0;
  let scale=1, minScale=1, ox=0, oy=0;

  function fit(){
    const w=stage.clientWidth;
    sw=w; sh=Math.round(w/R);
    stage.style.aspectRatio=R;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=sw*dpr; cv.height=sh*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    minScale=Math.max(sw/img.width, sh/img.height);
    scale=minScale; ox=(sw-img.width*scale)/2; oy=(sh-img.height*scale)/2;
    $('zoom').value=100; $('zv').textContent='100%';
    draw();
  }
  function clamp(){
    const w=img.width*scale, h=img.height*scale;
    ox=Math.min(0, Math.max(sw-w, ox));
    oy=Math.min(0, Math.max(sh-h, oy));
  }
  function draw(){
    clamp();
    ctx.fillStyle='#0E0E0E'; ctx.fillRect(0,0,sw,sh);
    ctx.drawImage(img, ox, oy, img.width*scale, img.height*scale);
  }
  function setZoom(pct, cx, cy){
    const old=scale;
    scale=minScale*(pct/100);
    const px=(cx??sw/2), py=(cy??sh/2);
    ox=px-(px-ox)*(scale/old);
    oy=py-(py-oy)*(scale/old);
    draw();
  }

  setTimeout(fit,30);
  window.addEventListener('resize',fit);

  $('zoom').oninput=e=>{ $('zv').textContent=e.target.value+'%'; setZoom(+e.target.value) };

  let drag=false,lx=0,ly=0,pinch=0,startScalePct=100;
  const pos=e=>{const r=stage.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);

  stage.addEventListener('pointerdown',e=>{drag=true;stage.classList.add('drag');
    const p=pos(e);lx=p.x;ly=p.y;stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!drag)return;
    const p=pos(e);ox+=p.x-lx;oy+=p.y-ly;lx=p.x;ly=p.y;draw()});
  stage.addEventListener('pointerup',()=>{drag=false;stage.classList.remove('drag')});
  stage.addEventListener('pointercancel',()=>{drag=false;stage.classList.remove('drag')});

  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===2){drag=false;pinch=dist(e.touches);startScalePct=+$('zoom').value}},{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinch){e.preventDefault();
      const k=dist(e.touches)/pinch;
      const pct=Math.min(400,Math.max(100,Math.round(startScalePct*k)));
      $('zoom').value=pct; $('zv').textContent=pct+'%';
      const r=stage.getBoundingClientRect();
      setZoom(pct,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,
                  (e.touches[0].clientY+e.touches[1].clientY)/2-r.top)}},{passive:false});
  stage.addEventListener('touchend',()=>{pinch=0});
  stage.addEventListener('wheel',e=>{e.preventDefault();
    const pct=Math.min(400,Math.max(100,+$('zoom').value+(e.deltaY<0?8:-8)));
    $('zoom').value=pct;$('zv').textContent=pct+'%';const p=pos(e);setZoom(pct,p.x,p.y)},{passive:false});

  document.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-ratio]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); R=+b.dataset.ratio; fit();
  });

  $('cropSave').onclick=()=>{
    // إخراج بدقة ثابتة ليخرج كل المنتجات بنفس المقاس
    const OW = R>=1 ? 800 : Math.round(800*R);
    const OH = R>=1 ? Math.round(800/R) : 800;
    const out=document.createElement('canvas');
    out.width=OW; out.height=OH;
    const octx=out.getContext('2d');
    octx.imageSmoothingQuality='high';
    octx.fillStyle='#FFFFFF'; octx.fillRect(0,0,OW,OH);
    const k=OW/sw;
    octx.drawImage(img, ox*k, oy*k, img.width*scale*k, img.height*scale*k);

    // ضغط تدريجي حتى ننزل تحت 700 كيلوبايت (حدّ مستند Firestore مليون بايت)
    let quality=0.85, data=out.toDataURL('image/jpeg',quality);
    while(data.length>700000 && quality>0.4){ quality-=0.1; data=out.toDataURL('image/jpeg',quality) }
    if(data.length>950000){ toast('الصورة كبيرة جدًا — جرّب صورة أصغر','rd'); return }

    window.removeEventListener('resize',fit);
    closeModal();
    onDone(data, Math.round(data.length/1024));
  };
}

/* حقل اختيار الصورة داخل النوافذ */
function pickerHTML(id,current,fallbackArt){
  return `<div class="picker">
    <div class="pick-prev" id="${id}Prev">${current?`<img src="${current}" alt="">`:art(fallbackArt||'notebook')}</div>
    <div class="pick-acts">
      <input type="file" id="${id}File" accept="image/*" hidden>
      <button type="button" class="btn gh sm" id="${id}Btn">${S(ic.upl,15,2.2)} ${current?'تغيير الصورة':'رفع صورة من الهاتف'}</button>
      <div class="row2">
        <button type="button" class="btn gh sm" id="${id}Draw" style="flex:1">استعمال رسم جاهز</button>
        ${current?`<button type="button" class="btn gh sm" id="${id}Clear" style="color:var(--red)">${S(ic.trash,14,2.2)}</button>`:''}
      </div>
      <span class="hint" id="${id}Info">${current?'صورة مرفوعة':'JPG أو PNG — تُقصّ وتُضغط تلقائيًا'}</span>
    </div>
  </div>`;
}
function wirePicker(id,state,artSelectId){
  const f=$(id+'File'), b=$(id+'Btn'), prev=$(id+'Prev'), info=$(id+'Info');
  b.onclick=()=>f.click();
  f.onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    if(!/^image\//.test(file.type)){toast('اختر ملف صورة','rd');return}
    if(file.size>12*1024*1024){toast('الصورة أكبر من 12 ميجابايت','rd');return}
    openCropper(file,(data,kb)=>{
      state.img=data;
      prev.innerHTML=`<img src="${data}" alt="">`;
      info.textContent=`صورة مرفوعة · ${kb} كيلوبايت`;
      b.innerHTML=`${S(ic.upl,15,2.2)} تغيير الصورة`;
      toast('تم حفظ الصورة');
    });
    e.target.value='';
  };
  $(id+'Draw').onclick=()=>{
    state.img=null;
    const k=artSelectId&&$(artSelectId)?$(artSelectId).value:'notebook';
    prev.innerHTML=art(k);
    info.textContent='رسم جاهز';
    b.innerHTML=`${S(ic.upl,15,2.2)} رفع صورة من الهاتف`;
  };
  if($(id+'Clear'))$(id+'Clear').onclick=()=>$(id+'Draw').click();
}

function exportCsv(){
  if(!orders.length)return toast('ما في طلبات للتصدير','rd');
  const head=['رقم الطلب','التاريخ','العميل','الهاتف','المدينة','العنوان','القطع','المنتجات','الإجمالي','الحالة'];
  const rows=orders.map(o=>[o.code||o.id,fmtDT(dOf(o)),o.customer?.name||'',o.customer?.phone||'',
    o.customer?.city||'',(o.customer?.address||'').replace(/[\n,]/g,' '),
    (o.items||[]).reduce((a,i)=>a+(i.qty||0),0),
    (o.items||[]).map(i=>`${i.name} ×${i.qty}`).join(' | '),
    m(o.total),o.status===4?'ملغي':STEPS[o.status||0]]);
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;a.download=`طلبات-${new Date().toISOString().slice(0,10)}.csv`;a.click();
  URL.revokeObjectURL(url);toast(`صُدِّر ${orders.length} طلب`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-act],[data-prod],[data-order],[data-cat],[data-promo],[data-fc],[data-fs],[data-setst],[data-del],[data-delcat],[data-delpromo],[data-delrev],[data-toggle],[data-restock],[data-close]');
  if(!t)return;
  const d=t.dataset;
  if(d.close){closeModal();return}
  if(d.nav){page=d.nav;closeModal();$('side').classList.remove('open');render();$('view').scrollTop=0;return}
  if(d.fc){fCat=d.fc;render();return}
  if(d.fs){fSt=d.fs;render();return}
  if(d.prod){const p=products.find(x=>x.id===d.prod);if(p)productModal(p);return}
  if(d.cat){const c=cats.find(x=>x.id===d.cat);if(c)catModal(c);return}
  if(d.order){const o=orders.find(x=>x.id===d.order);if(o)orderModal(o);return}
  if(d.promo){const p=promos.find(x=>x.id===d.promo);if(p)promoModal(p);return}
  if(d.restock){const p=products.find(x=>x.id===d.restock);if(p)restockModal(p);return}
  if(d.toggle){const p=products.find(x=>x.id===d.toggle);
    if(p)ok(()=>updateDoc(doc(db,'products',p.id),{active:p.active===false}),
      p.active===false?'المنتج ظاهر الآن':'المنتج مخفي الآن',['تغيير حالة منتج',p.name]);return}
  if(d.del){const p=products.find(x=>x.id===d.del);
    if(p)confirmModal('حذف المنتج',`سيُحذف "${p.name}" نهائيًا.`,'حذف',
      ()=>ok(()=>deleteDoc(doc(db,'products',p.id)),'تم الحذف',['حذف منتج',p.name]));return}
  if(d.delcat){const c=cats.find(x=>x.id===d.delcat);
    const used=products.filter(p=>p.cat===d.delcat).length;
    if(used)return toast(`لا يمكن الحذف — ${used} منتج داخل هذا القسم`,'rd');
    confirmModal('حذف القسم',`سيُحذف قسم "${c.name}".`,'حذف',
      ()=>ok(()=>deleteDoc(doc(db,'categories',d.delcat)),'تم الحذف',['حذف قسم',c.name]));return}
  if(d.delpromo){confirmModal('حذف الكود',`سيُحذف كود "${d.delpromo}".`,'حذف',
    ()=>ok(()=>deleteDoc(doc(db,'promos',d.delpromo)),'تم الحذف',['حذف كود',d.delpromo]));return}
  if(d.delrev){confirmModal('حذف المراجعة','لن تظهر للزبائن بعد الحذف.','حذف',
    ()=>ok(()=>deleteDoc(doc(db,'reviews',d.delrev)),'تم الحذف',['حذف مراجعة','']));return}
  if(d.setst){const [id,s]=d.setst.split('|');
    const o=orders.find(x=>x.id===id);
    const hist=[...(o.statusHistory||[]),{status:+s,at:new Date().toISOString()}];
    ok(()=>updateDoc(doc(db,'orders',id),{status:+s,statusHistory:hist,updatedAt:serverTimestamp()}),
      'تم تحديث حالة الطلب',['تحديث طلب',`#${o.code||id} → ${+s===4?'ملغي':STEPS[+s]}`]);return}
  const a=d.act;
  if(a==='newProduct'){if(!cats.length)return toast('أضف قسمًا أولًا','rd');productModal(null);return}
  if(a==='newCat'){catModal(null);return}
  if(a==='newPromo'){promoModal(null);return}
  if(a==='editSettings'){settingsModal();return}
  if(a==='seed'){seed();return}
  if(a==='reload'){location.reload();return}
  if(a==='exportCsv'){exportCsv();return}
  if(a==='logout'){sessionStorage.removeItem('bs_admin');location.reload();return}
});
$('scrim').onclick=closeModal;
$('burger').onclick=()=>$('side').classList.toggle('open');
$('notifBtn').onclick=()=>{page='notif';render()};
$('meBtn').onclick=()=>{page='settings';render()};

const keepFocus=id=>{const el=$(id);if(el){const v=el.value;el.focus();el.setSelectionRange(v.length,v.length)}};
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='qProd'){q=e.target.value;render();keepFocus('qProd')}
  if(id==='qOrd'){qOrd=e.target.value;render();keepFocus('qOrd')}
  if(id==='qCust'){qCust=e.target.value;render();keepFocus('qCust')}
});
document.addEventListener('change',e=>{if(e.target.id==='rangeSel'){days=+e.target.value;render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('gq').focus()}
  if(e.key==='Escape')closeModal();
});
$('gq').addEventListener('input',e=>{
  const v=e.target.value.trim();if(!v)return;
  if(/^#?\d+$/.test(v)){qOrd=v.replace('#','');page='orders';fSt='all'}
  else{q=v;page='products';fCat='all'}
  render();$('gq').focus();
});

function enter(){$('gate').classList.add('gone');setTimeout(()=>$('gate').remove(),420);listen();render()}
$('doGate').onclick=async()=>{
  const v=$('pass').value.trim();
  let real='bolhia2026';
  try{const s=await getDoc(doc(db,'settings','store'));if(s.exists()&&s.data().adminPass)real=s.data().adminPass}catch(e){}
  if(v===real){sessionStorage.setItem('bs_admin','1');enter()}else toast('رمز غير صحيح','rd');
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('doGate').click()});
if(sessionStorage.getItem('bs_admin'))enter();else render();
</script>
