<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1C1C">
<title>قرطاسية بولحية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C1C1C; --surface:#242424; --surface-2:#2E2E2E; --surface-3:#383838;
  --line:#3A3A3A; --line-soft:#333;
  --or:#FC7702; --or-dim:#D96500; --or-glow:rgba(252,119,2,.28); --or-wash:rgba(252,119,2,.12);
  --tx:#F5F4F2; --tx-2:#A9A6A1; --tx-3:#75726E;
  --green:#3DBE84; --red:#E5544B; --blue:#4B9BE5; --gold:#F2C94C;
  --r:16px; --r-sm:12px; --r-lg:20px;
  --nav-h:66px;
  --e:cubic-bezier(.22,.68,.32,1);
  --e-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:Cairo,system-ui,sans-serif;background:#111;color:var(--tx);
  font-size:14px;line-height:1.7;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3{margin:0;font-weight:800;line-height:1.35}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

/* ═══════ shell ═══════ */
.phone{
  position:relative;width:100%;max-width:440px;height:100%;margin:0 auto;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 80px rgba(0,0,0,.6);
}
.viewport{flex:1;position:relative;overflow:hidden}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  background:var(--bg);-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
}
.screen::-webkit-scrollbar{width:0}
.screen.in-f{animation:inF .26s var(--e-out) both}
.screen.in-b{animation:inB .26s var(--e-out) both}
.screen.out-f{animation:outF .22s var(--e) both}
.screen.out-b{animation:outB .22s var(--e) both}
@keyframes inF{from{transform:translateX(-14%);opacity:.5}to{transform:none;opacity:1}}
@keyframes outF{from{transform:none;opacity:1}to{transform:translateX(9%);opacity:0}}
@keyframes inB{from{transform:translateX(14%);opacity:.5}to{transform:none;opacity:1}}
@keyframes outB{from{transform:none;opacity:1}to{transform:translateX(-9%);opacity:0}}
.body{flex:1;padding-bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom))}
.body.nonav{padding-bottom:30px}
.body.hasbar{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ═══════ splash ═══════ */
#splash{
  position:absolute;inset:0;z-index:300;background:var(--bg);
  display:grid;place-items:center;overflow:hidden;
}
#splash::before{
  content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(252,119,2,.5) 0%,rgba(252,119,2,.12) 42%,transparent 68%);
  filter:blur(38px);animation:breathe 3.6s var(--e) infinite alternate;
}
@keyframes breathe{from{transform:scale(.94);opacity:.8}to{transform:scale(1.04);opacity:1}}
.sp-in{position:relative;text-align:center;z-index:2}
.sp-mark{
  width:104px;height:104px;margin:0 auto 22px;border-radius:30px;
  background:linear-gradient(150deg,#3A3A3A,#222);
  display:grid;place-items:center;color:var(--or);
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 22px 50px -14px rgba(0,0,0,.9),0 0 60px -12px var(--or-glow);
  animation:markIn .6s var(--e-out) both;
}
@keyframes markIn{0%{transform:scale(.82);opacity:0}100%{transform:none;opacity:1}}
.sp-in h1{font-size:34px;font-weight:900;letter-spacing:-.5px;animation:up .8s .28s var(--e-out) both}
.sp-in p{margin:4px 0 0;color:var(--tx-2);font-size:13px;letter-spacing:.22em;animation:up .8s .42s var(--e-out) both}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.sp-bar{
  width:132px;height:3px;border-radius:3px;background:var(--surface-2);
  margin:34px auto 0;overflow:hidden;animation:up .8s .56s var(--e-out) both;
}
.sp-bar i{display:block;height:100%;width:0;background:var(--or);border-radius:3px;
  box-shadow:0 0 12px var(--or);animation:load 1.5s .6s var(--e) forwards}
@keyframes load{to{width:100%}}
#splash.gone{animation:spOut .55s var(--e) forwards}
@keyframes spOut{to{opacity:0;transform:scale(1.08);visibility:hidden}}

/* ═══════ header ═══════ */
.hd{
  position:sticky;top:0;z-index:40;background:rgba(28,28,28,.86);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent;
  transition:border-color .25s;
}
.hd.stuck{border-bottom-color:var(--line-soft)}
.hd h2{font-size:17px;flex:1;text-align:center}
.hd .side{width:40px;flex:0 0 auto;display:flex;justify-content:center}
.ib{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:var(--surface);color:var(--tx);position:relative;flex:0 0 auto;
  transition:transform .16s var(--e),background .2s;
}
.ib:active{transform:scale(.88);background:var(--surface-2)}
.ib.plain{background:none}
.dot-n{position:absolute;top:8px;inset-inline-start:9px;width:8px;height:8px;border-radius:50%;
  background:var(--or);border:2px solid var(--bg);box-shadow:0 0 8px var(--or)}

/* home header */
.hd-home{display:flex;align-items:center;gap:11px;padding:calc(12px + env(safe-area-inset-top)) 16px 2px}
.hd-home .av{
  width:38px;height:38px;border-radius:13px;background:var(--surface);
  display:grid;place-items:center;color:var(--tx-2);flex:0 0 auto;border:1px solid var(--line-soft)
}
.hd-home .who{flex:1;min-width:0}
.hd-home .who b{display:block;font-size:14.5px;font-weight:700;line-height:1.35}
.hd-home .who span{display:block;font-size:11px;color:var(--tx-3);line-height:1.3}

/* ═══════ search ═══════ */
.sb{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:15px;padding:0 14px;margin:14px 16px 0;
  transition:border-color .22s,box-shadow .22s;
}
.sb:focus-within{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.sb input{flex:1;background:none;border:0;outline:none;padding:13px 0;font-size:14px}
.sb input::placeholder{color:var(--tx-3)}
.sb svg{color:var(--tx-3);flex:0 0 auto}
.sb .flt{width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--tx-2);display:grid;place-items:center;flex:0 0 auto}
.sb.big{border-radius:16px;margin-top:12px}
.sb.big input{padding:15px 0;font-size:14.5px}

/* ═══════ banner ═══════ */
.bwrap{margin-top:20px}
.brail{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.brail::-webkit-scrollbar{display:none}
.ban{
  flex:0 0 84%;scroll-snap-align:center;border-radius:var(--r-lg);padding:17px 18px 16px;
  position:relative;overflow:hidden;min-height:124px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid rgba(255,255,255,.07);
}
.ban.b1{background:linear-gradient(120deg,#3A2410,#232323 62%)}
.ban.b2{background:linear-gradient(120deg,#1D2E28,#232323 62%)}
.ban.b3{background:linear-gradient(120deg,#2B2038,#232323 62%)}
.ban::after{content:"";position:absolute;inset-inline-start:-56px;top:-56px;width:190px;height:190px;
  border-radius:50%;background:var(--or);opacity:.1;filter:blur(30px)}
.ban .tagx{
  display:inline-block;font-size:10.5px;font-weight:700;color:var(--or);background:var(--or-wash);
  border:1px solid rgba(252,119,2,.3);border-radius:20px;padding:3px 11px;margin-bottom:9px;width:fit-content;
}
.ban h3{font-size:19px;font-weight:900;margin-bottom:3px;position:relative}
.ban h3 em{font-style:normal;color:var(--or)}
.ban p{margin:0 0 11px;font-size:11.5px;color:var(--tx-3);position:relative;max-width:22ch}
.ban .go{
  align-self:flex-start;background:var(--or);color:#fff;border-radius:11px;padding:8px 16px;
  font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;position:relative;
  box-shadow:0 8px 20px -8px var(--or-glow);transition:transform .16s var(--e)
}
.ban .go:active{transform:scale(.95)}
.ban .art{position:absolute;inset-inline-end:14px;bottom:8px;width:104px;opacity:.95}
.dots{display:flex;gap:6px;justify-content:center;margin-top:13px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--surface-3);transition:all .3s var(--e)}
.dots i.on{width:20px;background:var(--or)}

/* ═══════ section head ═══════ */
.sh{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 12px}
.sh h3{font-size:16.5px;font-weight:800}
.sh button{font-size:12.5px;color:var(--or);font-weight:700;display:flex;align-items:center;gap:3px}

/* ═══════ quick cats ═══════ */
.qrail{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.qrail::-webkit-scrollbar{display:none}
.qc{flex:0 0 auto;width:68px;text-align:center}
.qc .bx{
  width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line-soft);
  display:grid;place-items:center;color:var(--tx-2);margin-bottom:7px;
  transition:transform .18s var(--e),border-color .2s,background .2s;
}
.qc:active .bx{transform:scale(.9);border-color:var(--or);background:var(--surface-2)}
.qc span{font-size:10.5px;color:var(--tx-2);display:block;line-height:1.35;font-weight:500}

/* ═══════ product card ═══════ */
.prail{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}
.prail::-webkit-scrollbar{display:none}
.prail .pc{flex:0 0 152px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.pc{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;text-align:start;position:relative;
  transition:transform .18s var(--e),border-color .2s;
}
.pc:active{transform:scale(.97);border-color:var(--surface-3)}
.pc .img{
  aspect-ratio:1;background:linear-gradient(160deg,#FCFCFC,#EDECEA);position:relative;
  display:grid;place-items:center;overflow:hidden;
}
.pc .img svg.art{width:74%;height:74%}
.pc .info{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1}
.pc .nm{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.pc .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.pc .pcol{display:flex;flex-direction:column;min-width:0}
.pc .pr{font-size:17px;font-weight:800;color:var(--or);white-space:nowrap;line-height:1.25}
.pc .pr small{font-size:10px;font-weight:600;margin-inline-start:2px;opacity:.85}
.pc .old{font-size:10.5px;color:var(--tx-3);text-decoration:line-through;line-height:1.3}
.pc .atc{
  width:34px;height:34px;border-radius:11px;background:var(--or);color:#fff;flex:0 0 auto;
  display:grid;place-items:center;transition:transform .14s var(--e),background .18s;
}
.pc .atc:active{transform:scale(.88);background:var(--or-dim)}
.pc .atc.done{background:var(--green)}
.pc .atc.off{background:var(--surface-2);color:var(--tx-3)}
.badge{
  position:absolute;top:9px;inset-inline-start:9px;font-size:9.5px;font-weight:800;
  border-radius:7px;padding:3px 8px;z-index:2;letter-spacing:.02em;
}
.badge.dis{background:var(--or);color:#fff;box-shadow:0 4px 12px -4px var(--or-glow)}
.badge.new{background:var(--green);color:#08251A}
.badge.low{background:var(--gold);color:#3A2C00}
.badge.out{background:#4A4A4A;color:#CFCCC8}
.hb{
  position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(28,28,28,.55);backdrop-filter:blur(8px);display:grid;place-items:center;
  color:#fff;z-index:2;transition:transform .18s var(--e),color .2s;
}
.hb:active{transform:scale(.8)}
.hb.on{color:var(--or)}
.hb.on svg{fill:currentColor}
.hb.beat{animation:beat .28s var(--e)}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}


/* ═══════ categories grid ═══════ */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.cat{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:20px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;
  position:relative;overflow:hidden;transition:transform .18s var(--e),border-color .2s;
}
.cat::before{content:"";position:absolute;top:-30px;inset-inline-end:-30px;width:90px;height:90px;
  border-radius:50%;background:var(--or);opacity:0;filter:blur(22px);transition:opacity .3s}
.cat:active{transform:scale(.96);border-color:var(--or)}
.cat:active::before{opacity:.16}
.cat .ci{width:56px;height:56px;display:grid;place-items:center;position:relative}
.cat b{font-size:13px;font-weight:700;position:relative}
.cat span{font-size:10.5px;color:var(--tx-3);position:relative}

/* ═══════ chips / tabs ═══════ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:0 0 auto;padding:8px 16px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line-soft);font-size:12.5px;font-weight:600;color:var(--tx-2);
  transition:all .2s var(--e);
}
.chips button.on{background:var(--or);color:#fff;border-color:var(--or)}
.chips button:active{transform:scale(.94)}

.tabs{display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line-soft)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:12px 14px;font-size:13px;font-weight:600;color:var(--tx-3);position:relative}
.tabs button.on{color:var(--or)}
.tabs button.on::after{content:"";position:absolute;bottom:-1px;inset-inline:10px;height:2.5px;
  background:var(--or);border-radius:3px;box-shadow:0 0 10px var(--or);animation:tabIn .28s var(--e)}
@keyframes tabIn{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}

/* ═══════ bottom nav ═══════ */
.nav{
  position:absolute;bottom:0;inset-inline:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(36,36,36,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-evenly;
  padding-inline:10px;transition:transform .28s var(--e);
}
.nav.hide{transform:translateY(120%)}
.nav button{
  display:flex;align-items:center;gap:0;color:var(--tx-3);
  font-size:12.5px;font-weight:700;padding:9px 13px;border-radius:14px;
  background:transparent;position:relative;
  transition:background .26s var(--e),color .22s var(--e),gap .26s var(--e),padding .26s var(--e);
}
.nav button .ic{display:flex;transition:transform .26s var(--e)}
.nav button .lb{
  max-width:0;overflow:hidden;white-space:nowrap;opacity:0;
  transition:max-width .3s var(--e),opacity .22s var(--e);
}
.nav button.on{color:var(--or);background:var(--or-wash);gap:7px;padding-inline:15px}
.nav button.on .lb{max-width:80px;opacity:1}
.nav button:active .ic{transform:scale(.86)}
.nav .nb{
  position:absolute;top:6px;inset-inline-start:9px;min-width:16px;height:16px;padding:0 4px;
  background:var(--or);color:#fff;border-radius:8px;font-size:9.5px;font-weight:800;
  display:grid;place-items:center;border:2px solid var(--surface);
}
.nav button.on .nb{border-color:#2E2A26}
.fabc{
  position:absolute;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);inset-inline-start:18px;
  width:54px;height:54px;border-radius:19px;background:var(--or);color:#fff;
  display:grid;place-items:center;z-index:51;
  box-shadow:0 10px 26px -8px var(--or-glow);
  transition:transform .22s var(--e),opacity .22s;
}
.fabc:active{transform:scale(.9)}
.fabc .cnt{
  position:absolute;top:-3px;inset-inline-start:-3px;min-width:22px;height:22px;padding:0 6px;
  background:#fff;color:var(--or);border-radius:11px;font-size:11px;font-weight:800;
  display:grid;place-items:center;border:2.5px solid var(--or);
}
.fabc .cnt.pop{animation:cpop .3s var(--e)}
@keyframes cpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ═══════ buttons ═══════ */
.btn{
  width:100%;background:var(--or);color:#fff;border-radius:15px;padding:15px;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 20px -12px var(--or-glow);transition:transform .16s var(--e),background .2s,opacity .2s;
}
.btn:active{transform:scale(.975);background:var(--or-dim)}
.btn.gh{background:var(--surface);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.gh:active{background:var(--surface-2)}
.btn.dark{background:var(--surface-2);color:var(--tx);box-shadow:none}
.btn:disabled{opacity:.45;pointer-events:none;box-shadow:none}
.btn.load{pointer-events:none}
.btn.load .lb{display:inline-block;width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════ auth ═══════ */
.auth{padding:0 22px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.auth .mark{
  width:76px;height:76px;border-radius:24px;background:linear-gradient(150deg,var(--surface-2),var(--surface));
  display:grid;place-items:center;color:var(--or);margin:0 auto 20px;border:1px solid var(--line);
  box-shadow:0 0 44px -12px var(--or-glow);
}
.auth h1{font-size:25px;text-align:center;margin-bottom:5px}
.auth .sub{text-align:center;color:var(--tx-2);font-size:13px;margin-bottom:30px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--tx-2);margin-bottom:7px}
.inp{
  display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:14px;padding:0 14px;transition:border-color .22s,box-shadow .22s;
}
.inp:focus-within{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.inp.bad{border-color:var(--red)}
.inp input,.inp select,.inp textarea{flex:1;background:none;border:0;outline:none;padding:14px 0;font-size:14.5px;width:100%}
.inp textarea{resize:vertical;min-height:74px;padding:13px 0}
.inp svg{color:var(--tx-3);flex:0 0 auto}
.inp select{color:var(--tx);appearance:none}
.inp select option{background:var(--surface-2)}
.err{font-size:11.5px;color:var(--red);margin-top:6px;display:none;animation:shk .32s}
.err.on{display:block}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{font-size:11.5px;color:var(--tx-3);margin-top:6px}
.arow{display:flex;justify-content:space-between;font-size:12.5px;margin-top:16px}
.arow button{color:var(--or);font-weight:600}
.arow span{color:var(--tx-3)}
.otp{display:flex;gap:9px;direction:ltr;justify-content:center;margin:6px 0 4px}
.otp input{
  width:52px;height:58px;text-align:center;font-size:22px;font-weight:800;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:14px;outline:none;transition:all .2s;
}
.otp input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.otp input.filled{border-color:var(--or);color:var(--or)}

/* ═══════ product detail ═══════ */
.gal{position:relative;background:linear-gradient(160deg,#FCFCFC,#E9E8E6);aspect-ratio:1.06}
.gal .slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .slides::-webkit-scrollbar{display:none}
.gal .sl{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center}
.gal .sl svg{width:66%;height:66%}
.gal .gdots{position:absolute;bottom:14px;inset-inline:0;display:flex;gap:6px;justify-content:center}
.gal .gdots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.2);transition:all .3s}
.gal .gdots i.on{width:19px;background:var(--or)}
.gal .top{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline:14px;display:flex;justify-content:space-between}
.gal .top .ib{background:rgba(255,255,255,.9);color:#222;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.pd{padding:20px 16px 0;margin-top:-22px;background:var(--bg);border-radius:26px 26px 0 0;position:relative;z-index:2}
.pd .cat-t{font-size:11px;color:var(--or);font-weight:700;margin-bottom:6px}
.pd h1{font-size:20px;margin-bottom:8px;line-height:1.5}
.pd .meta{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:12px;color:var(--tx-2)}
.pd .meta .st{display:flex;align-items:center;gap:4px}
.pd .meta .st b{color:var(--gold);display:flex}
.pd .pblk{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.pd .pblk .now{font-size:29px;font-weight:900;color:var(--or)}
.pd .pblk .now small{font-size:13px;font-weight:700}
.pd .pblk .was{font-size:14px;color:var(--tx-3);text-decoration:line-through}
.pd .pblk .cut{background:var(--or-wash);color:var(--or);font-size:11px;font-weight:800;border-radius:8px;padding:3px 9px;border:1px solid rgba(252,119,2,.3)}
.stk{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border-radius:10px;padding:7px 12px;margin-bottom:20px}
.stk.ok{background:rgba(61,190,132,.12);color:var(--green)}
.stk.low{background:rgba(242,201,76,.12);color:var(--gold)}
.stk.no{background:rgba(229,84,75,.12);color:var(--red)}
.stk i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.sect-t{font-size:14px;font-weight:800;margin:0 0 10px}
.pd p.desc{color:var(--tx-2);font-size:13.5px;line-height:1.9;margin:0 0 20px}
.specs{background:var(--surface);border-radius:var(--r);padding:4px 14px;margin-bottom:22px;border:1px solid var(--line-soft)}
.specs div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.specs div:last-child{border-bottom:0}
.specs dt{color:var(--tx-3)}
.specs dd{margin:0;font-weight:600}
.revs{margin-bottom:22px}
.rev{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:13px;margin-bottom:9px}
.rev .rh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.rev .ra{width:32px;height:32px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;color:var(--tx-2);font-weight:800;font-size:13px;flex:0 0 auto}
.rev .rn{flex:1;font-size:13px;font-weight:700}
.rev .rs{display:flex;gap:1px;color:var(--gold)}
.rev p{margin:0;font-size:12.5px;color:var(--tx-2);line-height:1.75}

.bbar{
  position:absolute;bottom:0;inset-inline:0;z-index:45;background:rgba(36,36,36,.97);
  backdrop-filter:blur(20px);border-top:1px solid var(--line-soft);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:11px;align-items:center;
  animation:barUp .26s var(--e-out) both;
}
@keyframes barUp{from{transform:translateY(100%)}to{transform:none}}
.qty{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;flex:0 0 auto}
.qty button{width:36px;height:44px;display:grid;place-items:center;color:var(--tx);transition:background .16s}
.qty button:active{background:var(--surface-2)}
.qty b{min-width:32px;text-align:center;font-size:14px;font-weight:700}
.qty.sm button{width:30px;height:32px}
.qty.sm b{min-width:26px;font-size:13px}

/* ═══════ cart ═══════ */
.ci{
  display:flex;gap:12px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:12px;margin-bottom:11px;position:relative;
  animation:itemIn .24s var(--e-out) both;
}
@keyframes itemIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.ci.rm{animation:itemOut .3s var(--e) forwards}
@keyframes itemOut{to{opacity:0;transform:translateX(-40px) scale(.94);height:0;margin:0;padding:0;border-width:0}}
.ci .th{width:74px;height:74px;border-radius:14px;background:linear-gradient(160deg,#FCFCFC,#EDECEA);
  display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.ci .th svg{width:74%;height:74%}
.ci .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.ci .nm{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci .br{font-size:10.5px;color:var(--tx-3);margin-bottom:8px}
.ci .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.ci .pr{font-size:15px;font-weight:800;color:var(--or)}
.ci .x{position:absolute;top:10px;inset-inline-start:10px;width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;color:var(--tx-3);background:var(--surface-2);transition:all .18s}
.ci .x:active{color:var(--red);transform:scale(.86)}
.sum{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;margin-top:6px}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;color:var(--tx-2)}
.sum .r b{color:var(--tx);font-weight:700}
.sum .r.dis b{color:var(--green)}
.sum .r.tot{border-top:1px dashed var(--line);margin-top:10px;padding-top:13px;font-size:16px;color:var(--tx);font-weight:800}
.sum .r.tot b{color:var(--or);font-size:20px}
.pfold{
  display:flex;align-items:center;gap:11px;width:100%;background:var(--surface);
  border:1px dashed var(--line);border-radius:14px;padding:13px 14px;margin-top:4px;
  font-size:13px;color:var(--tx-2);transition:border-color .2s,background .2s;
}
.pfold .pi{color:var(--tx-3);display:flex}
.pfold .pt{flex:1;text-align:start;font-weight:600}
.pfold.ok{border-style:solid;border-color:rgba(61,190,132,.4);background:rgba(61,190,132,.07);color:var(--green)}
.pfold.ok .pi{color:var(--green)}
.promo{display:flex;gap:9px;margin:10px 0 0;animation:fu .28s var(--e-out) both}
.promo .inp{flex:1}
.promo button{background:var(--surface-2);border-radius:14px;padding:0 18px;font-size:13px;font-weight:700;color:var(--or);transition:background .18s}
.promo button:active{background:var(--surface-3)}

/* ═══════ address / option cards ═══════ */
.opt{
  display:flex;align-items:center;gap:13px;background:var(--surface);border:1.5px solid var(--line-soft);
  border-radius:var(--r);padding:14px;margin-bottom:10px;width:100%;text-align:start;
  transition:border-color .22s,background .2s,transform .16s var(--e);
}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--or);background:rgba(252,119,2,.06)}
.opt .rd{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;transition:border-color .2s}
.opt.on .rd{border-color:var(--or)}
.opt .rd i{width:11px;height:11px;border-radius:50%;background:var(--or);transform:scale(0);transition:transform .22s var(--e)}
.opt.on .rd i{transform:scale(1)}
.opt .oi{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--tx-2);flex:0 0 auto}
.opt .om{flex:1;min-width:0}
.opt b{display:block;font-size:13.5px;font-weight:700}
.opt span{display:block;font-size:11.5px;color:var(--tx-3);line-height:1.5}

/* ═══════ success ═══════ */
.succ{padding:60px 26px 30px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.succ .ring{
  width:104px;height:104px;border-radius:50%;border:3.5px solid var(--or);color:var(--or);
  display:grid;place-items:center;margin-bottom:26px;position:relative;
  animation:ringIn .42s var(--e-out) both;
}
.succ .ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid var(--or);
  opacity:0;animation:pulse 2s .6s var(--e) infinite}
@keyframes ringIn{0%{transform:scale(.72);opacity:0}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.3);opacity:0}}
.succ .ring svg{animation:drawIn .5s .3s var(--e-out) both}
@keyframes drawIn{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.succ h2{font-size:23px;margin-bottom:8px;animation:up .5s .35s var(--e-out) both}
.succ p{color:var(--tx-2);font-size:13.5px;margin:0 0 24px;animation:up .5s .45s var(--e-out) both;max-width:30ch}
.ocard{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:16px 20px;margin-bottom:26px;width:100%;animation:up .5s .55s var(--e-out) both;
}
.ocard .r{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--tx-2)}
.ocard .r b{color:var(--tx);font-weight:700}
.ocard .r.big b{color:var(--or);font-size:16px;font-weight:800}
.succ .acts{width:100%;display:flex;flex-direction:column;gap:10px;animation:up .5s .65s var(--e-out) both}

/* ═══════ orders / timeline ═══════ */
.ord{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;
  margin-bottom:11px;width:100%;text-align:start;transition:transform .16s var(--e),border-color .2s;
}
.ord:active{transform:scale(.985);border-color:var(--surface-3)}
.ord .t{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ord .oid{font-size:14px;font-weight:800}
.ord .m{display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;color:var(--tx-3)}
.ord .amt{font-size:15px;font-weight:800;color:var(--or)}
.ord .thumbs{display:flex;gap:6px;margin-bottom:11px}
.ord .thumbs span{width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,#FCFCFC,#EDECEA);display:grid;place-items:center;overflow:hidden}
.ord .thumbs span svg{width:74%;height:74%}
.ord .thumbs .more{background:var(--surface-2);color:var(--tx-2);font-size:11px;font-weight:700;place-items:center;display:grid}
.stt{font-size:10.5px;font-weight:800;border-radius:8px;padding:4px 10px}
.stt.s0{background:rgba(75,155,229,.14);color:var(--blue)}
.stt.s1{background:var(--or-wash);color:var(--or)}
.stt.s2{background:rgba(242,201,76,.14);color:var(--gold)}
.stt.s3{background:rgba(61,190,132,.14);color:var(--green)}
.stt.s4{background:rgba(229,84,75,.14);color:var(--red)}

.tl{padding:6px 0}
.tls{display:flex;gap:15px;position:relative;padding-bottom:24px}
.tls:last-child{padding-bottom:0}
.tls::before{content:"";position:absolute;inset-inline-start:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.tls:last-child::before{display:none}
.tls.done::before{background:var(--or)}
.tld{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:transparent;flex:0 0 auto;z-index:1;transition:all .3s var(--e)}
.tls.done .tld{background:var(--or);border-color:var(--or);color:#fff}
.tls.now .tld{border-color:var(--or);box-shadow:0 0 0 5px var(--or-wash)}
.tls.now .tld::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;
  border:2px solid var(--or);animation:pulse 1.9s var(--e) infinite}
.tls b{display:block;font-size:13.5px;font-weight:700}
.tls span{font-size:11.5px;color:var(--tx-3)}
.tls:not(.done):not(.now) b{color:var(--tx-3);font-weight:500}

/* ═══════ notifications ═══════ */
.nt{
  display:flex;gap:13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px;margin-bottom:10px;position:relative;transition:transform .16s var(--e);
}
.nt:active{transform:scale(.985)}
.nt.unread{background:rgba(252,119,2,.05);border-color:rgba(252,119,2,.22)}
.nt.unread::after{content:"";position:absolute;top:15px;inset-inline-start:13px;width:7px;height:7px;
  border-radius:50%;background:var(--or);box-shadow:0 0 8px var(--or)}
.nt .ni{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}
.nt .ni.a{background:var(--or-wash);color:var(--or)}
.nt .ni.b{background:rgba(61,190,132,.12);color:var(--green)}
.nt .ni.c{background:rgba(75,155,229,.12);color:var(--blue)}
.nt .nm{flex:1;min-width:0;padding-inline-start:0}
.nt b{display:block;font-size:13.5px;font-weight:700;margin-bottom:2px}
.nt p{margin:0;font-size:12px;color:var(--tx-2);line-height:1.65}
.nt time{font-size:10.5px;color:var(--tx-3);margin-top:4px;display:block}

/* ═══════ account ═══════ */
.prof{padding:22px 16px;display:flex;align-items:center;gap:14px}
.prof .pa{width:64px;height:64px;border-radius:22px;background:var(--surface);
  display:grid;place-items:center;color:var(--tx-2);border:1px solid var(--line);flex:0 0 auto;position:relative}
.prof .pa .ed{position:absolute;bottom:-3px;inset-inline-start:-3px;width:24px;height:24px;border-radius:50%;
  background:var(--or);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.prof .pi{flex:1;min-width:0}
.prof .pi b{display:block;font-size:17px;font-weight:800}
.prof .pi span{font-size:12.5px;color:var(--tx-2)}
.stats{display:flex;gap:10px;padding:0 16px 6px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;color:var(--tx)}
.stat span{font-size:10.5px;color:var(--tx-3)}
.mgrp{margin:16px 16px 0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.mi{display:flex;align-items:center;gap:13px;padding:14px 15px;width:100%;text-align:start;
  border-bottom:1px solid var(--line-soft);transition:background .18s}
.mi:last-child{border-bottom:0}
.mi:active{background:var(--surface-2)}
.mi .mic{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--tx-2);flex:0 0 auto}
.mi .mm{flex:1;min-width:0}
.mi b{display:block;font-size:13.5px;font-weight:600}
.mi span{font-size:11px;color:var(--tx-3)}
.mi .cnt{font-size:11.5px;color:var(--tx-3);font-weight:600}
.mi.danger .mic{background:rgba(229,84,75,.12);color:var(--red)}
.mi.danger b{color:var(--red)}

/* ═══════ sheet / dialog ═══════ */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:180;opacity:0;pointer-events:none;
  transition:opacity .28s var(--e);backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;bottom:0;inset-inline:0;z-index:190;background:var(--surface);
  border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .32s var(--e-out);max-height:86%;overflow-y:auto;
  border-top:1px solid var(--line);pointer-events:none;
}
.sheet.on{transform:none;pointer-events:auto}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--surface-3);margin:0 auto 16px}
.sheet h3{font-size:17px;margin-bottom:4px}
.sheet .sd{color:var(--tx-2);font-size:12.5px;margin:0 0 18px}
.dlg{
  position:absolute;top:50%;inset-inline:26px;transform:translateY(-50%) scale(.9);opacity:0;z-index:190;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 22px;text-align:center;
  pointer-events:none;transition:transform .3s var(--e-out),opacity .25s;
}
.dlg.on{transform:translateY(-50%) scale(1);opacity:1;pointer-events:auto}
.dlg .di{width:56px;height:56px;border-radius:19px;background:rgba(229,84,75,.12);color:var(--red);
  display:grid;place-items:center;margin:0 auto 15px}
.dlg h3{font-size:17px;margin-bottom:7px}
.dlg p{color:var(--tx-2);font-size:13px;margin:0 0 20px}
.dlg .row{display:flex;gap:10px}

/* ═══════ toast ═══════ */
.toast{
  position:absolute;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));inset-inline:16px;z-index:250;
  background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
  display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.8);
  transform:translateY(120%);opacity:0;transition:transform .26s var(--e-out),opacity .2s;
  pointer-events:none;
}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast .ti{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.toast .ti.ok{background:rgba(61,190,132,.14);color:var(--green)}
.toast .ti.or{background:var(--or-wash);color:var(--or)}
.toast .ti.rd{background:rgba(229,84,75,.14);color:var(--red)}

/* ═══════ states ═══════ */
.empty{padding:70px 34px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.empty .er{width:96px;height:96px;border-radius:32px;background:var(--surface);border:1px solid var(--line-soft);
  display:grid;place-items:center;color:var(--tx-3);margin-bottom:20px;position:relative}
.empty .er::after{content:"";position:absolute;inset:-16px;border-radius:40px;background:var(--or);opacity:.05;filter:blur(20px)}
.empty h3{font-size:17px;margin-bottom:8px}
.empty p{color:var(--tx-2);font-size:13px;margin:0 0 24px;line-height:1.8;max-width:28ch}
.empty .btn{max-width:230px}
.sk{background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:220% 100%;animation:shim 1.4s infinite;border-radius:12px}
@keyframes shim{to{background-position:-220% 0}}
.sk-pc{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line-soft)}
.sk-pc .a{aspect-ratio:1}
.sk-pc .b{padding:12px}
.sk-pc .b i{display:block;height:10px;border-radius:5px;margin-bottom:8px}
.pull{
  position:absolute;top:0;inset-inline:0;display:grid;place-items:center;height:0;overflow:hidden;
  color:var(--or);transition:height .25s var(--e);z-index:5;
}
.pull.on{height:52px}
.pull i{width:22px;height:22px;border:2.5px solid var(--surface-3);border-top-color:var(--or);
  border-radius:50%;animation:spin .7s linear infinite}
.fu{animation:fu .28s var(--e-out) both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="viewport" id="vp"></div>

  <button class="fabc" id="fab" style="display:none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h2.5l2.6 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.55L21.5 8H6"/></svg>
    <i class="cnt" id="fabCnt" style="display:none">0</i>
  </button>

  <nav class="nav" id="nav" style="display:none"></nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>

function tickTo(el,to,pre='',suf=''){
  const from=parseFloat(el.dataset.v||0);
  if(Math.abs(from-to)<.005){el.textContent=pre+m(to)+suf;el.dataset.v=to;return}
  const t0=performance.now();
  const st=t=>{const k=Math.min((t-t0)/380,1),e=1-Math.pow(1-k,3);
    el.textContent=pre+m(from+(to-from)*e)+suf;
    if(k<1)requestAnimationFrame(st);else el.dataset.v=to};
  requestAnimationFrame(st);
}

const sortIt=(a,k)=>{const x=[...a];
  if(k==='low')x.sort((p,q)=>p.price-q.price);
  else if(k==='high')x.sort((p,q)=>q.price-p.price);
  else if(k==='rate')x.sort((p,q)=>q.rate-p.rate);
  else if(k==='off')x.sort((p,q)=>q.off-p.off);
  else x.sort((p,q)=>q.revs-p.revs);
  return x};

      <button class="btn gh" id="waOrder">${S(ic.chat,17,2)} تواصل معنا</button>
      ${o.s<2&&!cancelled?`<button class="btn gh" data-cancel="${o.id}" style="color:var(--red)">إلغاء الطلب</button>`:''}
    </div>
    <div style="height:18px"></div>
  </div></div>`;
};

/* ══════════════════════════════════════════════
   الموجّه
   ══════════════════════════════════════════════ */
let st={cat:'all',sort:'pop',pid:null,oid:null,addr:0,phone:'',pq:1};
let stack=['home'], cur=null;
const NAVBAR=[
  {p:'home',t:'الرئيسية',i:'home'},
  {p:'cats',t:'الأقسام',i:'grid'},
  {p:'orders',t:'الطلبات',i:'box'},
  {p:'account',t:'حسابي',i:'user'}
];
const ROOTS=NAVBAR.map(n=>n.p);

function paintNav(p){
  const show=ROOTS.includes(p);
  const nav=$('nav'),fab=$('fab');
  nav.style.display='flex';fab.style.display='grid';
  nav.classList.toggle('hide',!show);
  const showFab=show&&cCount()>0;
  fab.style.opacity=showFab?'1':'0';
  fab.style.pointerEvents=showFab?'auto':'none';
  fab.style.transform=showFab?'none':'scale(.5)';
  const active=orders.filter(o=>o.s<3&&o.s!==4).length;
  nav.innerHTML=NAVBAR.map(n=>{
    const bdg=n.p==='orders'&&active?`<i class="nb">${active}</i>`:'';
    return `<button class="${p===n.p?'on':''}" data-go="${n.p}">
      <span class="ic">${S(ic[n.i],22,2)}${bdg}</span><span class="lb">${n.t}</span></button>`;
  }).join('');
}

function go(p,dir='f'){
  if(p==='home')stack=['home'];
  else if(dir==='f'&&stack[stack.length-1]!==p)stack.push(p);
  paint(p,dir);
}
function back(){
  if(stack.length>1){stack.pop();paint(stack[stack.length-1],'b')}
  else paint('home','b');
}
function paint(p,dir='f'){
  const vp=$('vp');
  const old=cur;
  const el=document.createElement('div');
  el.className='screen '+(dir==='f'?'in-f':'in-b');
  el.innerHTML=V[p]?V[p]():'';
  el.dataset.p=p;
  vp.appendChild(el);
  if(old){old.className='screen '+(dir==='f'?'out-f':'out-b');setTimeout(()=>old.remove(),320)}
  cur=el;
  paintNav(p);bump();
  el.addEventListener('scroll',()=>{const h=el.querySelector('.hd');if(h)h.classList.toggle('stuck',el.scrollTop>6)});
  afterPaint(p,el);
}

function afterPaint(p,el){
  if(p==='home'){
    const rail=el.querySelector('#brail'),dots=el.querySelector('#bdots');
    if(rail)rail.addEventListener('scroll',()=>{
      const i=Math.round(rail.scrollLeft/-rail.offsetWidth*1)||Math.round(Math.abs(rail.scrollLeft)/(rail.scrollWidth/3));
      [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===Math.min(2,i)));
    });
    let sy=0;
    el.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
    el.addEventListener('touchmove',e=>{
      if(el.scrollTop<=0&&e.touches[0].clientY-sy>70&&!el.dataset.ref){
        el.dataset.ref=1;$('pull')?.classList.add('on');
        setTimeout(()=>{$('pull')?.classList.remove('on');delete el.dataset.ref;toast('تم التحديث')},1000);
      }},{passive:true});
  }
  if(p==='product'){
    st.pq=1;
    const sl=el.querySelector('#slides'),gd=el.querySelector('#gdots');
    if(sl)sl.addEventListener('scroll',()=>{
      const i=Math.round(Math.abs(sl.scrollLeft)/sl.offsetWidth);
      [...gd.children].forEach((d,k)=>d.classList.toggle('on',k===Math.min(2,i)));
    });
  }
  if(p==='search'){setTimeout(()=>el.querySelector('#q')?.focus(),300);searchBox('')}
  if(p==='otp')setTimeout(()=>el.querySelector('[data-otp="0"]')?.focus(),300);
}

/* ══════════════════════════════════════════════
   الأحداث
   ══════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-back],[data-cat],[data-p],[data-add],[data-fav],[data-sort],[data-order],[data-term],[data-note],[data-addr],[data-pay],[data-sheet],[data-cq],[data-del],[data-pq],[data-home],[data-guest],[data-clear],[data-cancel],[data-x],[data-share]');
  if(!t)return;
  const d=t.dataset;

  if(d.x!==undefined){closeSheet();return}
  if(d.back){back();return}
  if(d.home){go('home');return}
  if(d.go){closeSheet();go(d.go);return}
  if(d.guest){user=null;save();go('home');toast('أهلًا بك');return}

  if(d.cat){closeSheet();st.cat=d.cat;go('list');return}
  if(d.p&&!d.add){st.pid=d.p;go('product');return}

  if(d.add!==undefined){
    e.stopPropagation();
    const p=PID[d.add];
    if(p.stock===0){toast('المنتج غير متوفّر حاليًا','rd');return}
    const ex=inCart(p.id);
    if(ex)ex.q++;else cart.push({id:p.id,q:1});
    save();bump();toast(`${p.name} أُضيف للسلة`,'or');
    if(t.classList.contains('atc')){t.classList.add('done');t.innerHTML=S(ic.check,16,3)}
    return;
  }
  if(d.fav){
    e.stopPropagation();
    const i=favs.indexOf(d.fav);
    if(i>-1){favs.splice(i,1);toast('أُزيل من المفضلة')}else{favs.push(d.fav);toast('أُضيف للمفضلة')}
    save();
    document.querySelectorAll(`[data-fav="${d.fav}"]`).forEach(b=>{
      const on=favs.includes(d.fav);b.classList.toggle('on',on);b.classList.add('beat');
      if(b.closest('.gal'))b.style.color=on?'var(--or)':'#222';
      setTimeout(()=>b.classList.remove('beat'),500)});
    if(stack[stack.length-1]==='favs')paint('favs','f');
    return;
  }
  if(d.sort){st.sort=d.sort;closeSheet();
    if(stack[stack.length-1]==='list')paint('list','f');
    else searchBox(document.getElementById('q')?.value);return}
  if(d.order){st.oid=d.order;go('order');return}
  if(d.term){const q=$('q');if(q){q.value=d.term;searchBox(d.term)}
    if(!recent.includes(d.term)){recent.unshift(d.term);recent=recent.slice(0,6);save()}return}
  if(d.clear){recent=[];save();searchBox('');return}
  if(d.note){const n=notes.find(x=>x.id==d.note);if(n){n.u=0;save();paint('notes','f')}return}
  if(d.addr!==undefined&&d.addr!==''){st.addr=+d.addr;paint('checkout','f');return}
  if(d.pay){return}
  if(d.share){toast('تم نسخ رابط المنتج');return}

  if(d.cq){
    const [i,v]=d.cq.split('|');cart[i].q+=+v;
    if(cart[i].q<1){cart.splice(i,1)}
    save();paint('cart','f');return;
  }
  if(d.del!==undefined){
    const row=t.closest('.ci');row.classList.add('rm');
    setTimeout(()=>{cart.splice(+d.del,1);save();paint('cart','f')},290);
    toast('أُزيل من السلة');return;
  }
  if(d.pq){st.pq=Math.max(1,st.pq+ +d.pq);$('pq').textContent=st.pq;return}
  if(d.cancel){
    confirmDlg('إلغاء الطلب','متأكد أنك تبي تلغي الطلب؟ ما تقدر ترجع عن هذا.','نعم، ألغِ',()=>{
      const o=orders.find(x=>x.id===d.cancel);if(o){o.s=4;save()}paint('order','f');toast('تم إلغاء الطلب','rd')});
    return;
  }
  if(d.sheet){sheets(d.sheet);return}
});

/* شيتات */
function sheets(k){
  if(k==='sort'){
    openSheet(`<h3>ترتيب النتائج</h3><p class="sd">اختر طريقة عرض المنتجات</p>
      ${[['pop','الأكثر شعبية'],['low','السعر: من الأقل للأعلى'],['high','السعر: من الأعلى للأقل'],['rate','الأعلى تقييمًا'],['off','أكبر خصم']]
        .map(([v,tt])=>`<button class="opt ${st.sort===v?'on':''}" data-sort="${v}"><span class="rd"><i></i></span><span class="om"><b>${tt}</b></span></button>`).join('')}`);
  }
  if(k==='addr'){
    openSheet(`<h3>عنوان جديد</h3><p class="sd">وين نوصّل لك؟</p>
      <div class="fld"><label>اسم العنوان</label><div class="inp"><input id="nT" placeholder="المنزل، العمل..."></div></div>
      <div class="fld"><label>المدينة</label><div class="inp">${S(ic.pin,17,2)}<select id="nC">${CITIES.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
      <div class="fld"><label>العنوان بالتفصيل</label><div class="inp"><textarea id="nD" placeholder="المنطقة، الشارع، أقرب علامة مميزة"></textarea></div></div>
      <button class="btn" id="saveAddr">حفظ العنوان</button>`);
    $('saveAddr').onclick=()=>{
      const T=$('nT').value.trim()||'عنوان',D=$('nD').value.trim();
      if(D.length<8){toast('اكتب العنوان بالتفصيل','rd');return}
      addrs.push({id:'a'+Date.now(),t:T,c:$('nC').value,d:D,i:'pin'});
      st.addr=addrs.length-1;save();closeSheet();paint('checkout','f');toast('تم حفظ العنوان');
    };
  }
  if(k==='addrList'){
    openSheet(`<h3>عناوين التوصيل</h3><p class="sd">${addrs.length} عنوان محفوظ</p>
      ${addrs.map(a=>`<div class="opt" style="pointer-events:none"><span class="oi">${S(ic.pin,18,2)}</span>
        <span class="om"><b>${a.t} — ${a.c}</b><span>${a.d}</span></span></div>`).join('')}
      <button class="btn gh" data-sheet="addr" style="margin-top:6px">إضافة عنوان جديد</button>`);
  }
  if(k==='pay'){
    openSheet(`<h3>طرق الدفع</h3><p class="sd">المتاح حاليًا</p>
      <div class="opt on"><span class="rd"><i></i></span><span class="oi">${S(ic.wallet,18,2)}</span>
        <span class="om"><b>الدفع عند الاستلام</b><span>تدفع للمندوب عند وصول الطلب</span></span></div>
      <div class="opt" style="opacity:.5"><span class="rd"><i></i></span><span class="oi">${S(ic.phone,18,2)}</span>
        <span class="om"><b>ليبيانا موبايل كاش</b><span>قريبًا</span></span></div>`);
  }
  if(k==='about'){
    openSheet(`<h3>قرطاسية بولحية</h3><p class="sd">شركة أبناء بولحية — طرابلس</p>
      <div class="specs"><div><dt>الإصدار</dt><dd class="num">1.0.0</dd></div>
      <div><dt>ساعات العمل</dt><dd>9ص — 8م</dd></div>
      <div><dt>أيام العمل</dt><dd>السبت — الخميس</dd></div>
      <div><dt>التوصيل</dt><dd>كل المدن</dd></div></div>
      <button class="btn gh" style="margin-top:14px" data-x="1">إغلاق</button>`);
  }
}

/* أحداث بالمعرّف */
document.addEventListener('click',e=>{
  if(e.target.closest('#doLogin')){
    const ph=$('lPhone').value.replace(/\s|-/g,''),nm=$('lName').value.trim();
    let ok=true;
    const bad=(w,er,b)=>{$(w).classList.toggle('bad',b);$(er).classList.toggle('on',b);if(b)ok=false};
    bad('wPhone','ePhone',!/^(09[1-6])\d{7}$/.test(ph));
    bad('wName','eName',nm.length<3);
    if(!ok)return;
    const b=e.target.closest('#doLogin');
    b.classList.add('load');b.innerHTML='<span class="lb"></span>';
    st.phone=ph;st.name=nm;
    setTimeout(()=>go('otp'),750);
    return;
  }
  if(e.target.closest('#doOtp')){
    const v=[...document.querySelectorAll('[data-otp]')].map(i=>i.value).join('');
    if(v.length<4){toast('أدخل الرمز كاملًا','rd');return}
    const b=e.target.closest('#doOtp');b.classList.add('load');b.innerHTML='<span class="lb"></span>';
    setTimeout(()=>{user={name:st.name,phone:st.phone};save();stack=['home'];paint('home','f');toast(`أهلًا ${st.name}`)},800);
    return;
  }
  if(e.target.closest('#pAdd')){
    const p=PID[st.pid],ex=inCart(p.id);
    if(ex)ex.q+=st.pq;else cart.push({id:p.id,q:st.pq});
    save();bump();toast(`أُضيف ${st.pq} × ${p.name}`,'or');return;
  }
  if(e.target.closest('#clearC')){
    confirmDlg('تفريغ السلة','متأكد أنك تبي تشيل كل المنتجات من السلة؟','نعم، فرّغها',()=>{
      cart=[];promo=null;save();bump();paint('cart','f');toast('تم تفريغ السلة','rd')});
    return;
  }
  if(e.target.closest('#foldPromo')){
    const b=$('promoBox');
    b.style.display=b.style.display==='none'?'flex':'none';
    if(b.style.display==='flex')setTimeout(()=>$('promo')?.focus(),120);
    return;
  }
  if(e.target.closest('#applyPromo')){
    const c=$('promo').value.trim().toUpperCase();
    if(c==='BOLHIA10'){promo={c,v:.10};toast('تم تفعيل الخصم 10%')}
    else if(c==='SCHOOL15'){promo={c,v:.15};toast('تم تفعيل الخصم 15%')}
    else{promo=null;toast('كود غير صحيح','rd')}
    paint('cart','f');return;
  }
  if(e.target.closest('#placeOrder')){
    const b=e.target.closest('#placeOrder');
    b.classList.add('load');b.innerHTML='<span class="lb"></span>';
    setTimeout(()=>{
      const d=new Date(),e2=new Date(Date.now()+864e5*2);
      orders.push({
        id:String(1240+orders.length+1),
        items:cart.map(i=>({id:i.id,q:i.q})),
        sub:cSub(),disc:cDisc(),ship:cShip(),total:cTot(),
        s:0,addr:st.addr,pay:'الدفع عند الاستلام',
        phone:user?user.phone:'—',note:$('cNote')?.value.trim()||'',
        date:`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`,
        eta:`${e2.getDate()}/${e2.getMonth()+1}`
      });
      notes.unshift({id:Date.now(),t:'تم تأكيد طلبك',b:`طلبك #${orders[orders.length-1].id} قيد المراجعة الآن.`,ty:'a',ic:'box',u:1,w:'الآن'});
      cart=[];promo=null;save();bump();
      stack=['home','done'];paint('done','f');
    },900);
    return;
  }
  if(e.target.closest('#readAll')){notes.forEach(n=>n.u=0);save();paint('notes','f');toast('تم تعليم الكل كمقروء');return}
  if(e.target.closest('#waAcc')||e.target.closest('#waOrder')){
    window.open(`https://wa.me/${WA}?text=${encodeURIComponent('سلام، عندي استفسار عن طلبي من قرطاسية بولحية')}`,'_blank');return}
  if(e.target.closest('#logout')){
    confirmDlg('تسجيل الخروج','متأكد أنك تبي تخرج من حسابك؟','خروج',()=>{
      user=null;save();stack=['login'];paint('login','f')});
    return;
  }
});

$('scrim').onclick=closeSheet;
$('fab').onclick=()=>go('cart');

document.addEventListener('input',e=>{
  if(e.target.id==='q'){searchBox(e.target.value);
    const v=e.target.value.trim();
    if(v.length>2&&!recent.includes(v)){recent=[v,...recent.filter(x=>x!==v)].slice(0,6);save()}}
  if(e.target.dataset.otp!==undefined){
    const i=+e.target.dataset.otp;
    e.target.value=e.target.value.replace(/\D/g,'');
    e.target.classList.toggle('filled',!!e.target.value);
    if(e.target.value&&i<3)document.querySelector(`[data-otp="${i+1}"]`)?.focus();
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.dataset?.otp!==undefined&&e.key==='Backspace'&&!e.target.value){
    const i=+e.target.dataset.otp;if(i>0)document.querySelector(`[data-otp="${i-1}"]`)?.focus();
  }
});

/* إقلاع */
setTimeout(()=>{
  $('splash').classList.add('gone');
  setTimeout(()=>$('splash').remove(),560);
  stack=[user?'home':'login'];
  paint(user?'home':'login','f');
},2200);
</script>
