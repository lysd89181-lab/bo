<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1C1C">
<title>الحساب — قرطاسية بولحية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C1C1C;--surface:#242424;--surface-2:#2E2E2E;--surface-3:#383838;
  --line:#3A3A3A;--line-soft:#333;
  --or:#FC7702;--or-dim:#D96500;--or-wash:rgba(252,119,2,.12);--or-glow:rgba(252,119,2,.3);
  --tx:#F5F4F2;--tx-2:#A9A6A1;--tx-3:#75726E;
  --green:#3DBE84;--red:#E5544B;--blue:#4B9BE5;
  --r:16px;--e:cubic-bezier(.22,.68,.32,1);--e-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:#111;color:var(--tx);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}
h1,h2,h3{margin:0;font-weight:800;line-height:1.35}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;box-shadow:0 0 70px rgba(0,0,0,.55);position:relative;overflow:hidden}
.hero{padding:calc(30px + env(safe-area-inset-top)) 22px 4px;text-align:center;position:relative}
.hero::before{content:"";position:absolute;top:-70px;inset-inline-start:50%;transform:translateX(50%);
  width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(252,119,2,.2),transparent 68%);filter:blur(34px)}
.mk{width:74px;height:74px;border-radius:24px;background:linear-gradient(150deg,var(--surface-2),var(--surface));
  display:grid;place-items:center;color:var(--or);margin:0 auto 16px;border:1px solid var(--line);
  box-shadow:0 0 44px -14px var(--or-glow);position:relative}
.hero h1{font-size:23px;margin-bottom:5px;position:relative}
.hero p{margin:0;color:var(--tx-2);font-size:13px;position:relative}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line-soft);border-radius:15px;
  padding:5px;margin:22px 22px 20px}
.tabs button{flex:1;padding:11px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--tx-3);
  transition:background .24s var(--e),color .2s}
.tabs button.on{background:var(--or);color:#fff;box-shadow:0 8px 18px -10px var(--or-glow)}

.form{padding:0 22px calc(34px + env(safe-area-inset-bottom));flex:1}
.pane{display:none}
.pane.on{display:block;animation:fu .3s var(--e-out) both}
@keyframes fu{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.steps{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.step{flex:1;height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.step i{display:block;height:100%;width:0;background:var(--or);border-radius:3px;transition:width .45s var(--e-out)}
.step.done i,.step.now i{width:100%}
.steplbl{font-size:11.5px;color:var(--tx-3);text-align:center;margin-bottom:18px;font-weight:600}

.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:7px}
.fld label i{color:var(--or);font-style:normal}
.inp{display:flex;align-items:center;gap:11px;background:var(--surface);border:1.5px solid var(--line-soft);
  border-radius:14px;padding:0 14px;transition:border-color .22s,box-shadow .22s}
.inp:focus-within{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.inp.bad{border-color:var(--red)}
.inp.good{border-color:rgba(61,190,132,.5)}
.inp input,.inp select,.inp textarea{flex:1;background:none;border:0;outline:none;padding:14px 0;font-size:14.5px;width:100%}
.inp textarea{min-height:74px;resize:vertical;padding:13px 0}
.inp select{appearance:none;cursor:pointer;color:var(--tx)}
.inp select option{background:var(--surface-2)}
.inp svg{color:var(--tx-3);flex:0 0 auto}
.inp .tog{color:var(--tx-3);display:flex;padding:4px}
.err{font-size:11.5px;color:var(--red);margin-top:6px;display:none;animation:shk .3s}
.err.on{display:block}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{font-size:11.5px;color:var(--tx-3);margin-top:6px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.meter{display:flex;gap:5px;margin-top:8px}
.meter i{flex:1;height:4px;border-radius:3px;background:var(--surface-2);transition:background .3s}
.meter.l1 i:nth-child(1){background:var(--red)}
.meter.l2 i:nth-child(-n+2){background:#F2C94C}
.meter.l3 i:nth-child(-n+3){background:var(--or)}
.meter.l4 i{background:var(--green)}

.btn{width:100%;background:var(--or);color:#fff;border-radius:15px;padding:15px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 26px -14px var(--or-glow);transition:transform .16s var(--e),background .2s,opacity .2s}
.btn:active{transform:scale(.98);background:var(--or-dim)}
.btn.gh{background:var(--surface);color:var(--tx);border:1.5px solid var(--line);box-shadow:none}
.btn.gh:active{background:var(--surface-2)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.load{pointer-events:none}
.lb{display:inline-block;width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px;margin-top:6px}
.row .btn{flex:1}

.alt{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--tx-3);font-size:11.5px}
.alt::before,.alt::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.foot{text-align:center;font-size:12.5px;color:var(--tx-3);margin-top:20px}
.foot button{color:var(--or);font-weight:700}

.loc{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:15px;
  display:flex;gap:12px;align-items:center;margin-bottom:15px;transition:border-color .22s,background .22s}
.loc.ok{border-style:solid;border-color:rgba(61,190,132,.45);background:rgba(61,190,132,.06)}
.loc .li{width:42px;height:42px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;
  color:var(--tx-2);flex:0 0 auto}
.loc.ok .li{background:rgba(61,190,132,.13);color:var(--green)}
.loc .lm{flex:1;min-width:0}
.loc b{display:block;font-size:13.5px;font-weight:700}
.loc span{display:block;font-size:11.5px;color:var(--tx-3);line-height:1.5}
.loc .lb2{font-size:12px;font-weight:700;color:var(--or);white-space:nowrap}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{padding:8px 14px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line-soft);
  font-size:12.5px;font-weight:600;color:var(--tx-2);transition:all .2s var(--e)}
.chip.on{background:var(--or);color:#fff;border-color:var(--or)}
.chip:active{transform:scale(.95)}

.done{text-align:center;padding:40px 10px}
.done .ring{width:96px;height:96px;border-radius:50%;border:3.5px solid var(--or);color:var(--or);
  display:grid;place-items:center;margin:0 auto 22px;animation:ringIn .45s var(--e-out) both;position:relative}
.done .ring::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:1.5px solid var(--or);
  opacity:0;animation:pulse 2s .5s var(--e) infinite}
@keyframes ringIn{0%{transform:scale(.72);opacity:0}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}
@keyframes pulse{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.3);opacity:0}}
.done h2{font-size:21px;margin-bottom:8px}
.done p{color:var(--tx-2);font-size:13.5px;margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;margin-bottom:20px;text-align:start}
.card .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}
.card .r span{color:var(--tx-3);flex:0 0 auto}
.card .r b{text-align:end;font-weight:600}

.note{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:13px;
  display:flex;gap:11px;font-size:12px;color:var(--tx-2);line-height:1.75;margin-top:18px}
.note .ni{color:var(--or);flex:0 0 auto;display:flex}

.toast{position:fixed;bottom:22px;inset-inline:16px;max-width:400px;margin:0 auto;z-index:200;
  background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:13px 15px;
  display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;pointer-events:none;
  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);transform:translateY(140%);opacity:0;
  transition:transform .3s var(--e-out),opacity .22s}
.toast.on{transform:none;opacity:1}
.toast .ti{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.ti.ok{background:rgba(61,190,132,.14);color:var(--green)}
.ti.rd{background:rgba(229,84,75,.14);color:var(--red)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" style="position:absolute;top:calc(16px + env(safe-area-inset-top));inset-inline-start:18px;
     width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-items:center;
     color:var(--tx-2);z-index:5;border:1px solid var(--line-soft)" aria-label="رجوع للمتجر">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="hero">
    <div class="mk"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg></div>
    <h1 id="hTitle">قرطاسية بولحية</h1>
    <p id="hSub">سجّل دخولك لمتابعة طلباتك</p>
  </div>
  <div class="tabs" id="tabs">
    <button class="on" data-tab="login">تسجيل الدخول</button>
    <button data-tab="reg">حساب جديد</button>
  </div>
  <div class="form" id="form"></div>
</div>
<div class="toast" id="toast"><span class="ti ok" id="tIc"></span><span id="tMsg"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAPhOPjAgfGhON7ZJGiXAfNf2GFQr-LbvU",authDomain:"bolhia-8d9e4.firebaseapp.com",
  projectId:"bolhia-8d9e4",storageBucket:"bolhia-8d9e4.firebasestorage.app",messagingSenderId:"488563746126",
  appId:"1:488563746126:web:876cb478bf6a3aad8e2a1f",measurementId:"G-M9M2HXZPYF"};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);

const ic={
 user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
 pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
 home:'<path d="M3 9.6 12 3l9 6.6V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9.5 22v-8h5v8"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 5.1-5.9m3.8-1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2"/><path d="M1 1l22 22"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 fwd:'<path d="m9 18 6-6-6-6"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
 cart:'<circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h2.5l2.6 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.55L21.5 8H6"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>'
};
const S=(p,s=18,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const CITIES=['طرابلس','بنغازي','مصراتة','الزاوية','صبراتة','زليتن','الخمس','ترهونة','غريان','سرت',
  'أجدابيا','البيضاء','درنة','طبرق','سبها','زوارة','بني وليد','مرزق','الجفرة','نالوت'];
const LABELS=['المنزل','العمل','عنوان آخر'];

const $=id=>document.getElementById(id);
let tab='login', step=1, geo=null, addrLabel='المنزل', me=null;
let tT;
function toast(msg,k='ok'){
  $('tIc').className='ti '+k;
  $('tIc').innerHTML=S(k==='rd'?ic.alert:ic.check,16,2.6);
  $('tMsg').textContent=msg;$('toast').classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>$('toast').classList.remove('on'),2800);
}
const mark=(w,e,bad)=>{const W=$(w);if(W){W.classList.toggle('bad',bad);W.classList.toggle('good',!bad&&W.querySelector('input')?.value)}
  const E=$(e);if(E)E.classList.toggle('on',bad);return !bad};
const errMsg=c=>({
 'auth/email-already-in-use':'هذا البريد مسجّل من قبل — جرّب تسجيل الدخول',
 'auth/invalid-email':'صيغة البريد غير صحيحة',
 'auth/weak-password':'كلمة المرور ضعيفة — 6 أحرف على الأقل',
 'auth/user-not-found':'ما في حساب بهذا البريد',
 'auth/wrong-password':'كلمة المرور غير صحيحة',
 'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة',
 'auth/too-many-requests':'محاولات كثيرة — انتظر قليلًا ثم أعد المحاولة',
 'auth/network-request-failed':'تعذّر الاتصال — تأكد من الإنترنت',
 'auth/operation-not-allowed':'تسجيل الدخول بالبريد غير مفعّل في Firebase Console'
}[c]||('حدث خطأ: '+c));

/* ═══════ الشاشات ═══════ */
const P={};

P.login=()=>`
  <div class="pane on">
    <div class="fld"><label>البريد الإلكتروني</label>
      <div class="inp" id="wEmail">${S(ic.mail)}<input id="lEmail" type="email" inputmode="email" placeholder="name@example.com" dir="ltr" style="text-align:start" autocomplete="email"></div>
      <div class="err" id="eEmail">أدخل بريدًا صحيحًا</div></div>
    <div class="fld"><label>كلمة المرور</label>
      <div class="inp" id="wPass">${S(ic.lock)}<input id="lPass" type="password" placeholder="••••••••" autocomplete="current-password">
        <button class="tog" data-tog="lPass">${S(ic.eye,17)}</button></div>
      <div class="err" id="ePass">أدخل كلمة المرور</div></div>
    <button class="btn" id="doLogin" style="margin-top:6px">تسجيل الدخول</button>
    <div class="foot"><button id="forgot">نسيت كلمة المرور؟</button></div>
    <div class="alt">أو</div>
    <button class="btn gh" id="guest">${S(ic.cart,17)} تصفّح كزائر</button>
    <div class="note"><span class="ni">${S(ic.info,16)}</span>
      <span>الزائر يقدر يتصفّح ويطلب، لكن الحساب يحفظ عناوينك وطلباتك ويخليك تتابع حالتها من أي جهاز.</span></div>
  </div>`;

P.reg=()=>`
  <div class="pane on">
    <div class="steps">
      <div class="step ${step>=1?'now':''}"><i></i></div>
      <div class="step ${step>=2?'now':''}"><i></i></div>
      <div class="step ${step>=3?'now':''}"><i></i></div>
    </div>
    <div class="steplbl">الخطوة ${step} من 3 — ${['بياناتك','بيانات الدخول','عنوان التوصيل'][step-1]}</div>
    ${step===1?`
      <div class="fld"><label>الاسم الكامل <i>*</i></label>
        <div class="inp" id="wName">${S(ic.user)}<input id="rName" placeholder="أحمد بولحية" autocomplete="name"></div>
        <div class="err" id="eName">اكتب اسمك الكامل (3 أحرف على الأقل)</div></div>
      <div class="fld"><label>رقم الهاتف <i>*</i></label>
        <div class="inp" id="wPhone">${S(ic.phone)}<input id="rPhone" inputmode="numeric" placeholder="0912345678" dir="ltr" style="text-align:start" autocomplete="tel"></div>
        <div class="hint">رقم ليبي يبدأ بـ 091 أو 092 أو 094 أو 095 أو 096</div>
        <div class="err" id="ePhone">الرقم غير صحيح</div></div>
      <button class="btn" id="next1" style="margin-top:10px">التالي ${S(ic.back,16,2.4)}</button>`
    :step===2?`
      <div class="fld"><label>البريد الإلكتروني <i>*</i></label>
        <div class="inp" id="wEmail2">${S(ic.mail)}<input id="rEmail" type="email" inputmode="email" placeholder="name@example.com" dir="ltr" style="text-align:start" autocomplete="email"></div>
        <div class="hint">يُستعمل لتسجيل الدخول واسترجاع كلمة المرور</div>
        <div class="err" id="eEmail2">أدخل بريدًا صحيحًا</div></div>
      <div class="fld"><label>كلمة المرور <i>*</i></label>
        <div class="inp" id="wPass2">${S(ic.lock)}<input id="rPass" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password">
          <button class="tog" data-tog="rPass">${S(ic.eye,17)}</button></div>
        <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div>
        <div class="err" id="ePass2">كلمة المرور قصيرة</div></div>
      <div class="fld"><label>تأكيد كلمة المرور <i>*</i></label>
        <div class="inp" id="wPass3">${S(ic.lock)}<input id="rPass2" type="password" placeholder="أعد كتابتها" autocomplete="new-password"></div>
        <div class="err" id="ePass3">كلمتا المرور غير متطابقتين</div></div>
      <div class="row"><button class="btn gh" id="back2">رجوع</button><button class="btn" id="next2">التالي</button></div>`
    :`
      <div class="fld"><label>المدينة <i>*</i></label>
        <div class="inp" id="wCity">${S(ic.pin)}<select id="rCity">${CITIES.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
      <div class="fld"><label>نوع العنوان</label>
        <div class="chips">${LABELS.map(l=>`<button type="button" class="chip ${addrLabel===l?'on':''}" data-lbl="${l}">${l}</button>`).join('')}</div></div>
      <div class="fld"><label>العنوان بالتفصيل <i>*</i></label>
        <div class="inp" id="wAddr">${S(ic.home)}<textarea id="rAddr" placeholder="المنطقة، الشارع، أقرب علامة مميزة"></textarea></div>
        <div class="err" id="eAddr">اكتب العنوان بالتفصيل (8 أحرف على الأقل)</div></div>
      <div class="loc ${geo?'ok':''}" id="locBox">
        <span class="li">${S(geo?ic.check:ic.target,19)}</span>
        <span class="lm"><b>${geo?'تم تحديد موقعك':'تحديد الموقع (اختياري)'}</b>
          <span>${geo?`<span class="num">${geo.lat.toFixed(5)}, ${geo.lng.toFixed(5)}</span>`:'يساعد المندوب يوصلك أسرع'}</span></span>
        <button class="lb2" id="getLoc">${geo?'تحديث':'تحديد'}</button></div>
      <div class="row"><button class="btn gh" id="back3">رجوع</button><button class="btn" id="doReg">إنشاء الحساب</button></div>
      <div class="note"><span class="ni">${S(ic.info,16)}</span>
        <span>بإنشاء الحساب توافق على أن نستعمل بياناتك لتوصيل طلباتك فقط.</span></div>`}
  </div>`;

P.done=()=>`
  <div class="pane on done">
    <div class="ring">${S(ic.check,44,3)}</div>
    <h2>أهلًا ${me?.name||''}</h2>
    <p>حسابك جاهز — تقدر تطلب وتتابع طلباتك الآن</p>
    <div class="card">
      <div class="r"><span>الاسم</span><b>${me?.name||'—'}</b></div>
      <div class="r"><span>الهاتف</span><b class="num">${me?.phone||'—'}</b></div>
      <div class="r"><span>البريد</span><b style="font-size:12px" dir="ltr">${me?.email||'—'}</b></div>
      <div class="r"><span>المدينة</span><b>${me?.city||'—'}</b></div>
      ${me?.address?`<div class="r"><span>العنوان</span><b style="max-width:58%;font-size:12.5px">${me.address}</b></div>`:''}
      ${me?.geo?`<div class="r"><span>الموقع</span><b class="num" style="font-size:12px">${me.geo.lat.toFixed(4)}, ${me.geo.lng.toFixed(4)}</b></div>`:''}
    </div>
    <button class="btn" id="toStore">${S(ic.cart,17)} ابدأ التسوّق</button>
    <button class="btn gh" id="logout" style="margin-top:10px">${S(ic.out,16)} تسجيل الخروج</button>
  </div>`;

function render(){
  $('form').innerHTML=P[tab]?P[tab]():'';
  $('tabs').style.display=tab==='done'?'none':'flex';
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('hTitle').textContent=tab==='done'?'تم إنشاء حسابك':'قرطاسية بولحية';
  $('hSub').textContent=tab==='done'?'كل شيء جاهز':(tab==='reg'?'أنشئ حسابك في ثلاث خطوات':'سجّل دخولك لمتابعة طلباتك');
  if(tab==='reg'&&step===2)wireMeter();
}

function wireMeter(){
  const p=$('rPass'),mt=$('meter');
  if(!p||!mt)return;
  p.addEventListener('input',()=>{
    const v=p.value;let n=0;
    if(v.length>=6)n++; if(v.length>=10)n++;
    if(/[A-Za-z]/.test(v)&&/\d/.test(v))n++;
    if(/[^A-Za-z0-9]/.test(v))n++;
    mt.className='meter'+(v?' l'+Math.max(1,n):'');
  });
}

/* ═══════ الأحداث ═══════ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-tog],[data-lbl],#doLogin,#doReg,#next1,#next2,#back2,#back3,#getLoc,#guest,#forgot,#toStore,#logout');
  if(!t)return;

  if(t.dataset.tab){tab=t.dataset.tab;step=1;render();return}
  if(t.dataset.tog){const i=$(t.dataset.tog);const show=i.type==='password';
    i.type=show?'text':'password';t.innerHTML=S(show?ic.eyeoff:ic.eye,17);return}
  if(t.dataset.lbl){addrLabel=t.dataset.lbl;
    document.querySelectorAll('[data-lbl]').forEach(x=>x.classList.toggle('on',x.dataset.lbl===addrLabel));return}

  if(t.id==='guest'){location.href='index.html';return}
  if(t.id==='toStore'){location.href='index.html';return}
  if(t.id==='logout'){await signOut(auth);me=null;tab='login';step=1;render();toast('تم تسجيل الخروج');return}

  if(t.id==='next1'){
    const nm=$('rName').value.trim(), ph=$('rPhone').value.replace(/[\s-]/g,'');
    let ok=mark('wName','eName',nm.length<3);
    ok=mark('wPhone','ePhone',!/^09[1-6]\d{7}$/.test(ph))&&ok;
    if(ok){sessionStorage.setItem('reg_name',nm);sessionStorage.setItem('reg_phone',ph);step=2;render()}
    return;
  }
  if(t.id==='back2'){step=1;render();return}
  if(t.id==='next2'){
    const em=$('rEmail').value.trim(), p1=$('rPass').value, p2=$('rPass2').value;
    let ok=mark('wEmail2','eEmail2',!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em));
    ok=mark('wPass2','ePass2',p1.length<6)&&ok;
    ok=mark('wPass3','ePass3',p1!==p2||!p2)&&ok;
    if(ok){sessionStorage.setItem('reg_email',em);sessionStorage.setItem('reg_pass',p1);step=3;render()}
    return;
  }
  if(t.id==='back3'){step=2;render();return}

  if(t.id==='getLoc'){
    if(!navigator.geolocation){toast('المتصفح لا يدعم تحديد الموقع','rd');return}
    t.textContent='جارٍ...';
    navigator.geolocation.getCurrentPosition(
      pos=>{geo={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};
        render();toast(`تم تحديد موقعك بدقة ${geo.acc} متر`)},
      err=>{t.textContent='تحديد';
        toast(err.code===1?'رفضت الإذن — فعّله من إعدادات المتصفح':'تعذّر تحديد الموقع','rd')},
      {enableHighAccuracy:true,timeout:12000,maximumAge:0});
    return;
  }

  if(t.id==='forgot'){
    const em=$('lEmail').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)){mark('wEmail','eEmail',true);toast('اكتب بريدك أولًا','rd');return}
    try{await sendPasswordResetEmail(auth,em);toast('أُرسل رابط إعادة التعيين لبريدك')}
    catch(err){toast(errMsg(err.code),'rd')}
    return;
  }

  if(t.id==='doLogin'){
    const em=$('lEmail').value.trim(), pw=$('lPass').value;
    let ok=mark('wEmail','eEmail',!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em));
    ok=mark('wPass','ePass',!pw)&&ok;
    if(!ok)return;
    t.classList.add('load');t.innerHTML='<span class="lb"></span>';
    try{
      const cred=await signInWithEmailAndPassword(auth,em,pw);
      const snap=await getDoc(doc(db,'users',cred.user.uid));
      me=snap.exists()?snap.data():{name:cred.user.displayName||'',email:em};
      tab='done';render();
    }catch(err){
      t.classList.remove('load');t.innerHTML='تسجيل الدخول';
      toast(errMsg(err.code),'rd');
    }
    return;
  }

  if(t.id==='doReg'){
    const addr=$('rAddr').value.trim();
    if(!mark('wAddr','eAddr',addr.length<8))return;
    const name=sessionStorage.getItem('reg_name'), phone=sessionStorage.getItem('reg_phone');
    const email=sessionStorage.getItem('reg_email'), pass=sessionStorage.getItem('reg_pass');
    const city=$('rCity').value;
    t.classList.add('load');t.innerHTML='<span class="lb"></span>';
    try{
      const cred=await createUserWithEmailAndPassword(auth,email,pass);
      await updateProfile(cred.user,{displayName:name});
      const data={uid:cred.user.uid,name,phone,email,city,address:addr,addressLabel:addrLabel,
        geo:geo?{lat:geo.lat,lng:geo.lng,acc:geo.acc}:null,createdAt:serverTimestamp()};
      await setDoc(doc(db,'users',cred.user.uid),data);
      await setDoc(doc(db,'users',cred.user.uid,'addresses','a1'),
        {label:addrLabel,city,address:addr,geo:data.geo,createdAt:serverTimestamp()});
      me={...data};
      ['reg_name','reg_phone','reg_email','reg_pass'].forEach(k=>sessionStorage.removeItem(k));
      tab='done';render();
    }catch(err){
      t.classList.remove('load');t.innerHTML='إنشاء الحساب';
      toast(errMsg(err.code),'rd');
      if(err.code==='auth/email-already-in-use'){setTimeout(()=>{tab='login';step=1;render()},1600)}
    }
    return;
  }
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if($('doLogin')&&document.activeElement?.closest('.pane')){e.preventDefault();$('doLogin').click()}
  else if($('next1')){e.preventDefault();$('next1').click()}
  else if($('next2')){e.preventDefault();$('next2').click()}
});

onAuthStateChanged(auth,async u=>{
  if(u&&!u.isAnonymous&&tab!=='done'&&!sessionStorage.getItem('reg_pass')){
    try{const snap=await getDoc(doc(db,'users',u.uid));
      me=snap.exists()?snap.data():{name:u.displayName||'',email:u.email};
      tab='done';render()}catch(e){}
  }
});

render();
</script>
