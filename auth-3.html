<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1C1C">
<title>الحساب — قرطاسية بولحية</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"></noscript>
<style>
:root{
  --bg:#1C1C1C;--surface:#242424;--surface-2:#2E2E2E;--surface-3:#383838;
  --line:#3A3A3A;--line-soft:#333;
  --or:#FC7702;--or-dim:#D96500;--or-wash:rgba(252,119,2,.12);--or-glow:rgba(252,119,2,.3);
  --tx:#F5F4F2;--tx-2:#A9A6A1;--tx-3:#75726E;
  --green:#3DBE84;--red:#E5544B;--blue:#4B9BE5;
  --r:16px;--e:cubic-bezier(.22,.68,.32,1);--e-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:Cairo,'Noto Sans Arabic','Segoe UI',system-ui,-apple-system,sans-serif;background:#111;color:var(--tx);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}
h1,h2,h3{margin:0;font-weight:800;line-height:1.35}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;
  box-shadow:0 0 70px rgba(0,0,0,.55);position:relative;overflow:hidden}
.back{position:absolute;top:calc(16px + env(safe-area-inset-top));inset-inline-start:18px;width:38px;height:38px;
  border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--tx-2);z-index:5;
  border:1px solid var(--line-soft);text-decoration:none}
.hero{padding:calc(30px + env(safe-area-inset-top)) 22px 4px;text-align:center;position:relative}
.hero::before{content:"";position:absolute;top:-70px;inset-inline-start:50%;transform:translateX(50%);
  width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(252,119,2,.2),transparent 68%);filter:blur(34px)}
.mk{width:72px;height:72px;border-radius:24px;background:linear-gradient(150deg,var(--surface-2),var(--surface));
  display:grid;place-items:center;color:var(--or);margin:0 auto 15px;border:1px solid var(--line);
  box-shadow:0 0 44px -14px var(--or-glow);position:relative}
.hero h1{font-size:22px;margin-bottom:5px;position:relative}
.hero p{margin:0;color:var(--tx-2);font-size:13px;position:relative}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line-soft);border-radius:15px;
  padding:5px;margin:20px 22px 18px}
.tabs button{flex:1;padding:11px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--tx-3);
  transition:background .24s var(--e),color .2s}
.tabs button.on{background:var(--or);color:#fff;box-shadow:0 8px 18px -10px var(--or-glow)}

.form{padding:0 22px calc(34px + env(safe-area-inset-bottom));flex:1}
.pane{animation:fu .3s var(--e-out) both}
@keyframes fu{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.steps{display:flex;gap:8px;margin-bottom:16px}
.step{flex:1;height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.step i{display:block;height:100%;width:0;background:var(--or);border-radius:3px;transition:width .45s var(--e-out)}
.step.now i{width:100%}
.steplbl{font-size:11.5px;color:var(--tx-3);text-align:center;margin-bottom:18px;font-weight:600}

.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--tx-2);margin-bottom:7px}
.fld label i{color:var(--or);font-style:normal}
.inp{display:flex;align-items:center;gap:11px;background:var(--surface);border:1.5px solid var(--line-soft);
  border-radius:14px;padding:0 14px;transition:border-color .22s,box-shadow .22s}
.inp:focus-within{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.inp.bad{border-color:var(--red)}
.inp input,.inp textarea{flex:1;background:none;border:0;outline:none;padding:14px 0;font-size:14.5px;width:100%}
.inp textarea{min-height:72px;resize:vertical;padding:13px 0}
.inp svg{color:var(--tx-3);flex:0 0 auto}
.inp .tog{color:var(--tx-3);display:flex;padding:4px}
.err{font-size:11.5px;color:var(--red);margin-top:6px;display:none;animation:shk .3s}
.err.on{display:block}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{font-size:11.5px;color:var(--tx-3);margin-top:6px;line-height:1.6}

/* ─── القائمة المنسدلة ─── */
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;gap:11px;background:var(--surface);
  border:1.5px solid var(--line-soft);border-radius:14px;padding:14px;text-align:start;
  transition:border-color .22s,box-shadow .22s}
.dd-btn:active{transform:scale(.995)}
.dd.open .dd-btn{border-color:var(--or);box-shadow:0 0 0 3px var(--or-wash)}
.dd-btn.bad{border-color:var(--red)}
.dd-btn .dv{flex:1;min-width:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn .dv.ph{color:var(--tx-3);font-weight:500}
.dd-btn .ar{color:var(--tx-3);display:flex;transition:transform .26s var(--e)}
.dd.open .dd-btn .ar{transform:rotate(180deg);color:var(--or)}
.dd-btn svg.lead{color:var(--tx-3);flex:0 0 auto}
.dd-pop{position:absolute;inset-inline:0;top:calc(100% + 7px);z-index:40;background:var(--surface-2);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 46px -14px rgba(0,0,0,.85);
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transform-origin:top;
  transition:opacity .2s var(--e),transform .24s var(--e-out)}
.dd.open .dd-pop{opacity:1;transform:none;pointer-events:auto}
.dd-search{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.dd-search input{flex:1;background:none;border:0;outline:none;font-size:14px;padding:2px 0}
.dd-search svg{color:var(--tx-3);flex:0 0 auto}
.dd-list{max-height:230px;overflow-y:auto;padding:6px}
.dd-list::-webkit-scrollbar{width:6px}
.dd-list::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:3px}
.dd-list button{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;
  font-size:13.5px;font-weight:600;color:var(--tx-2);text-align:start;transition:background .16s,color .16s}
.dd-list button:hover{background:var(--surface-3);color:var(--tx)}
.dd-list button.on{background:var(--or-wash);color:var(--or)}
.dd-list button .ck{margin-inline-start:auto;display:none;color:var(--or)}
.dd-list button.on .ck{display:flex}
.dd-empty{padding:22px 12px;text-align:center;color:var(--tx-3);font-size:12.5px}

/* ─── اختيار نمط الموقع ─── */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mode{background:var(--surface);border:1.5px solid var(--line-soft);border-radius:16px;padding:15px 12px;
  text-align:center;transition:all .22s var(--e);position:relative;overflow:hidden}
.mode:active{transform:scale(.97)}
.mode.on{border-color:var(--or);background:rgba(252,119,2,.07)}
.mode .mi{width:42px;height:42px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;
  color:var(--tx-2);margin:0 auto 9px;transition:all .22s}
.mode.on .mi{background:var(--or-wash);color:var(--or)}
.mode b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.mode span{display:block;font-size:10.5px;color:var(--tx-3);line-height:1.5}
.mode .ck{position:absolute;top:8px;inset-inline-start:8px;color:var(--or);display:none}
.mode.on .ck{display:flex}

.loc{background:var(--surface);border:1.5px dashed var(--line);border-radius:15px;padding:16px;margin-bottom:15px;
  transition:border-color .22s,background .22s}
.loc.ok{border-style:solid;border-color:rgba(61,190,132,.45);background:rgba(61,190,132,.06)}
.loc .lt{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.loc .li{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;
  color:var(--tx-2);flex:0 0 auto}
.loc.ok .li{background:rgba(61,190,132,.13);color:var(--green)}
.loc .lm{flex:1;min-width:0}
.loc b{display:block;font-size:13.5px;font-weight:700}
.loc span{display:block;font-size:11.5px;color:var(--tx-3);line-height:1.55}
.acc{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--tx-3);margin-top:2px}
.acc i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}

.btn{width:100%;background:var(--or);color:#fff;border-radius:15px;padding:15px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 26px -14px var(--or-glow);transition:transform .16s var(--e),background .2s,opacity .2s}
.btn:active{transform:scale(.98);background:var(--or-dim)}
.btn.gh{background:var(--surface);color:var(--tx);border:1.5px solid var(--line);box-shadow:none}
.btn.gh:active{background:var(--surface-2)}
.btn.sm{padding:11px 15px;font-size:13px;border-radius:12px;width:auto}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.load{pointer-events:none}
.btn.google{background:#fff;color:#1F1F1F;box-shadow:0 8px 22px -14px rgba(255,255,255,.5)}
.btn.google:active{background:#EAEAEA}
.lb{display:inline-block;width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.google .lb{border-color:rgba(0,0,0,.2);border-top-color:#1F1F1F}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px;margin-top:6px}
.row .btn{flex:1}

.meter{display:flex;gap:5px;margin-top:8px}
.meter i{flex:1;height:4px;border-radius:3px;background:var(--surface-2);transition:background .3s}
.meter.l1 i:nth-child(1){background:var(--red)}
.meter.l2 i:nth-child(-n+2){background:#F2C94C}
.meter.l3 i:nth-child(-n+3){background:var(--or)}
.meter.l4 i{background:var(--green)}

.alt{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--tx-3);font-size:11.5px}
.alt::before,.alt::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.foot{text-align:center;font-size:12.5px;color:var(--tx-3);margin-top:18px}
.foot button{color:var(--or);font-weight:700}

.done{text-align:center;padding:36px 6px}
.done .ring{width:94px;height:94px;border-radius:50%;border:3.5px solid var(--or);color:var(--or);
  display:grid;place-items:center;margin:0 auto 20px;animation:ringIn .45s var(--e-out) both;position:relative}
.done .ring::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:1.5px solid var(--or);
  opacity:0;animation:pulse 2s .5s var(--e) infinite}
@keyframes ringIn{0%{transform:scale(.72);opacity:0}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}
@keyframes pulse{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.3);opacity:0}}
.done h2{font-size:21px;margin-bottom:8px}
.done p{color:var(--tx-2);font-size:13.5px;margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;margin-bottom:18px;text-align:start}
.card .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}
.card .r span{color:var(--tx-3);flex:0 0 auto}
.card .r b{text-align:end;font-weight:600;min-width:0;word-break:break-word}
.note{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:13px;
  display:flex;gap:11px;font-size:12px;color:var(--tx-2);line-height:1.75;margin-top:16px}
.note .ni{color:var(--or);flex:0 0 auto;display:flex}

.toast{position:fixed;bottom:22px;inset-inline:16px;max-width:400px;margin:0 auto;z-index:200;
  background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:13px 15px;
  display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;pointer-events:none;
  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);transform:translateY(140%);opacity:0;
  transition:transform .3s var(--e-out),opacity .22s}
.toast.on{transform:none;opacity:1}
.toast .ti{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.ti.ok{background:rgba(61,190,132,.14);color:var(--green)}
.ti.rd{background:rgba(229,84,75,.14);color:var(--red)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

function ddHTML(id, icon, placeholder, value, searchable){
  return `<div class="dd" id="${id}">
    <button type="button" class="dd-btn" data-dd="${id}">
      ${icon?`<span class="lead" style="display:flex">${S(ic[icon],18)}</span>`:''}
      <span class="dv ${value?'':'ph'}" id="${id}Val">${value||placeholder}</span>
      <span class="ar">${S(ic.down,17,2.4)}</span>
    </button>
    <div class="dd-pop">
      ${searchable?`<div class="dd-search">${S(ic.search,16)}
        <input type="text" placeholder="ابحث..." data-ddq="${id}"></div>`:''}
      <div class="dd-list" id="${id}List"></div>
    </div>
  </div>`;
}
function ddFill(id, items, current, onPick){
  const list=$(id+'List'); if(!list)return;
  const paint=q=>{
    const f=q?items.filter(x=>x.includes(q)):items;
    list.innerHTML=f.length
      ? f.map(x=>`<button type="button" class="${x===current?'on':''}" data-ddpick="${id}|${x}">
          ${x}<span class="ck">${S(ic.check,15,3)}</span></button>`).join('')
      : `<div class="dd-empty">ما في نتائج</div>`;
  };
  paint('');
  const q=document.querySelector(`[data-ddq="${id}"]`);
  if(q){ q.value=''; q.oninput=()=>paint(q.value.trim()); }
  ddFill.cbs=ddFill.cbs||{}; ddFill.cbs[id]=onPick;
}
function ddClose(){ if(openDD){ $(openDD)?.classList.remove('open'); openDD=null } }
function ddSet(id,val){
  const v=$(id+'Val'); if(!v)return;
  v.textContent=val; v.classList.remove('ph');
  $(id)?.querySelector('.dd-btn')?.classList.remove('bad');
}

function render(){

  $('form').innerHTML=P[tab]?P[tab]():'';
  const hide=['done','profile'].includes(tab);
  $('tabs').style.display=hide?'none':'flex';
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('hTitle').textContent=tab==='done'?'تم بنجاح':tab==='profile'?'خطوة أخيرة':'قرطاسية بولحية';
  $('hSub').textContent=tab==='done'?'حسابك جاهز'
    :tab==='profile'?'نحتاج اسمك ورقمك للتوصيل'
    :(tab==='reg'?'أنشئ حسابك في ثلاث خطوات':'سجّل دخولك لمتابعة طلباتك');

  if(tab==='reg'&&step===2)wireMeter();
  if(tab==='reg'&&step===3){
    ddFill('ddCity',CITIES,city,v=>{
      city=v; area=''; ddSet('ddCity',v);
      if(locMode==='desc'){ render(); setTimeout(()=>$('ddArea')?.classList.add('open'),260); }
    });
    if(locMode==='desc'&&$('ddArea'))
      ddFill('ddArea', city?AREAS[city]:[], area, v=>{ area=v; ddSet('ddArea',v) });
    ddFill('ddLabel',LABELS,addrLabel,v=>{ addrLabel=v; ddSet('ddLabel',v) });
  }
}
function wireMeter(){
  const p=$('rPass'),mt=$('meter'); if(!p||!mt)return;
  p.addEventListener('input',()=>{
    const v=p.value;let n=0;
    if(v.length>=6)n++; if(v.length>=10)n++;
    if(/[A-Za-z]/.test(v)&&/\d/.test(v))n++;
    if(/[^A-Za-z0-9]/.test(v))n++;
    mt.className='meter'+(v?' l'+Math.max(1,n):'');
  });
}

async function saveProfile(uid, extra){
  const data={
    uid, name:me.name, phone:me.phone, email:me.email||'',
    city, area:locMode==='desc'?area:'', address:me.address||'',
    addressLabel:addrLabel, locMode,
    geo: geo?{lat:geo.lat,lng:geo.lng,acc:geo.acc}:null,
    updatedAt:serverTimestamp(), ...(extra||{})
  };
  await setDoc(doc(db,'users',uid), data, {merge:true});
  await setDoc(doc(db,'users',uid,'addresses','a1'), {
    label:addrLabel, city, area:data.area, address:data.address, geo:data.geo,
    createdAt:serverTimestamp()
  }, {merge:true});
  me={...me,...data};
}

    me.address=$('rAddr2')?.value.trim()||'';
  }
  return ok;
}

/* ═══════ الأحداث ═══════ */
document.addEventListener('click',async e=>{
  const dd=e.target.closest('[data-dd]');
  const pick=e.target.closest('[data-ddpick]');
  if(!e.target.closest('.dd')) ddClose();

  if(dd){
    const id=dd.dataset.dd;
    if(openDD===id){ ddClose(); return }
    ddClose(); $(id).classList.add('open'); openDD=id;
    setTimeout(()=>document.querySelector(`[data-ddq="${id}"]`)?.focus(),240);
    return;
  }
  if(pick){
    const [id,val]=pick.dataset.ddpick.split('|');
    ddClose();
    ddFill.cbs?.[id]?.(val);
    return;
  }

  const t=e.target.closest('[data-tab],[data-tog],[data-mode],#doLogin,#gLogin,#doReg,#next1,#next2,#back2,#back3,#getLoc,#guest,#forgot,#toStore,#logout,#toStep3');
  if(!t)return;

  if(t.dataset.tab){tab=t.dataset.tab;step=1;render();return}
  if(t.dataset.tog){const i=$(t.dataset.tog);const show=i.type==='password';
    i.type=show?'text':'password';t.innerHTML=S(show?ic.eyeoff:ic.eye,17);return}
  if(t.dataset.mode){locMode=t.dataset.mode;render();return}

  if(t.id==='guest'||t.id==='toStore'){location.href='index.html';return}
  if(t.id==='logout'){await signOut(auth);me=null;tab='login';step=1;
    city='';area='';geo=null;needProfile=false;render();toast('تم تسجيل الخروج');return}

  /* ── جوجل ── */
  if(t.id==='gLogin'){
    t.classList.add('load');t.innerHTML='<span class="lb"></span>';
    const prov=new GoogleAuthProvider();
    prov.setCustomParameters({prompt:'select_account'});
    try{
      const cred=await signInWithPopup(auth,prov);
      await afterSocial(cred.user);
    }catch(err){
      if(['auth/popup-blocked','auth/cancelled-popup-request','auth/operation-not-supported-in-this-environment']
          .includes(err.code)){
        try{ await signInWithRedirect(auth,prov); return }catch(e2){ toast(errMsg(e2.code),'rd') }
      }else toast(errMsg(err.code),'rd');
      t.classList.remove('load');t.innerHTML=GLOGO+' المتابعة عبر حساب جوجل';
    }
    return;
  }

  if(t.id==='next1'){
    const nm=$('rName').value.trim(), ph=$('rPhone').value.replace(/[\s-]/g,'');
    let ok=mark('wName','eName',nm.length<3);
    ok=mark('wPhone','ePhone',!/^09[1-6]\d{7}$/.test(ph))&&ok;
    if(ok){me={...(me||{}),name:nm,phone:ph};step=2;render()}
    return;
  }
  if(t.id==='toStep3'){
    const nm=$('rName').value.trim(), ph=$('rPhone').value.replace(/[\s-]/g,'');
    let ok=mark('wName','eName',nm.length<3);
    ok=mark('wPhone','ePhone',!/^09[1-6]\d{7}$/.test(ph))&&ok;
    if(ok){me={...(me||{}),name:nm,phone:ph};needProfile=true;tab='reg';step=3;render()}
    return;
  }
  if(t.id==='back2'){step=1;render();return}
  if(t.id==='next2'){
    const em=$('rEmail').value.trim(), p1=$('rPass').value, p2=$('rPass2').value;
    let ok=mark('wEmail2','eEmail2',!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em));
    ok=mark('wPass2','ePass2',p1.length<6)&&ok;
    ok=mark('wPass3','ePass3',p1!==p2||!p2)&&ok;
    if(ok){me={...me,email:em,_pass:p1};step=3;render()}
    return;
  }
  if(t.id==='back3'){ step=needProfile?1:2; if(needProfile){tab='profile'} render(); return }

  if(t.id==='getLoc'){
    if(!navigator.geolocation){toast('المتصفح لا يدعم تحديد الموقع','rd');return}
    t.classList.add('load');t.innerHTML='<span class="lb"></span> جارٍ التحديد...';
    navigator.geolocation.getCurrentPosition(
      pos=>{
        geo={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};
        render(); toast(`تم تحديد موقعك بدقة ${geo.acc} متر`);
      },
      err=>{
        render();
        toast(err.code===1?'رفضت إذن الموقع — فعّله من إعدادات المتصفح'
             :err.code===3?'انتهت المهلة — تأكد أن GPS مفعّل'
             :'تعذّر تحديد الموقع','rd');
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0});
    return;
  }

  if(t.id==='forgot'){
    const em=$('lEmail').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)){mark('wEmail','eEmail',true);toast('اكتب بريدك أولًا','rd');return}
    try{await sendPasswordResetEmail(auth,em);toast('أُرسل رابط إعادة التعيين لبريدك')}
    catch(err){toast(errMsg(err.code),'rd')}
    return;
  }

  if(t.id==='doLogin'){
    const em=$('lEmail').value.trim(), pw=$('lPass').value;
    let ok=mark('wEmail','eEmail',!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em));
    ok=mark('wPass','ePass',!pw)&&ok;
    if(!ok)return;
    t.classList.add('load');t.innerHTML='<span class="lb"></span>';
    try{
      const cred=await signInWithEmailAndPassword(auth,em,pw);
      const snap=await getDoc(doc(db,'users',cred.user.uid));
      me=snap.exists()?snap.data():{name:cred.user.displayName||'',email:em};
      tab='done';render();
    }catch(err){
      t.classList.remove('load');t.innerHTML='تسجيل الدخول';
      toast(errMsg(err.code),'rd');
    }
    return;
  }

  if(t.id==='doReg'){
    if(!validateStep3())return;
    t.classList.add('load');t.innerHTML='<span class="lb"></span>';
    try{
      if(needProfile){
        await saveProfile(auth.currentUser.uid);
        tab='done';render();return;
      }
      const cred=await createUserWithEmailAndPassword(auth,me.email,me._pass);
      await updateProfile(cred.user,{displayName:me.name});
      delete me._pass;
      await saveProfile(cred.user.uid,{createdAt:serverTimestamp()});
      tab='done';render();
    }catch(err){
      t.classList.remove('load');t.innerHTML='إنشاء الحساب';
      toast(errMsg(err.code),'rd');
      if(err.code==='auth/email-already-in-use')setTimeout(()=>{tab='login';step=1;render()},1700);
    }
    return;
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ddClose();return}
  if(e.key!=='Enter')return;
  const b=$('doLogin')||$('next1')||$('next2')||$('toStep3');
  if(b&&!e.target.closest('.dd-search')){e.preventDefault();b.click()}
});

/* ── بعد الدخول الاجتماعي: أكمل الملف إن كان ناقصًا ── */
async function afterSocial(u){
  const snap=await getDoc(doc(db,'users',u.uid));
  if(snap.exists() && snap.data().phone && snap.data().city){
    me=snap.data(); tab='done'; render(); return;
  }
  me={name:u.displayName||'', email:u.email||'', phone:snap.exists()?(snap.data().phone||''):''};
  needProfile=true; tab='profile'; render();
  toast('أهلًا! أكمل بياناتك لنقدر نوصّل لك');
}

/* نتيجة إعادة التوجيه (لو مُنعت النافذة المنبثقة) */
getRedirectResult(auth).then(r=>{ if(r?.user) afterSocial(r.user) }).catch(()=>{});

onAuthStateChanged(auth,async u=>{
  if(!u||u.isAnonymous||tab==='done'||needProfile||me?._pass)return;
  try{
    const snap=await getDoc(doc(db,'users',u.uid));
    if(snap.exists()&&snap.data().phone&&snap.data().city){ me=snap.data(); tab='done'; render() }
  }catch(e){}
});

render();
</script>
